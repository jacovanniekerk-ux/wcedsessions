<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PD Journey - WCED Professional Development</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'wcg-green': '#76B82A',
                        'wcg-yellow': '#FDB913',
                        'wcg-red': '#E30613',
                        'wcg-blue': '#001489',
                        'wcg-purple': '#672D82',
                        'wcg-pink': '#C8126E',
                        'wcg-dark': '#1a1a1a',
                        'wcg-gray': '#666666'
                    },
                    fontFamily: {
                        'sans': ['Century Gothic', 'Arial', 'Helvetica', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        @keyframes pulseGlow {

            0%,
            100% {
                box-shadow: 0 0 8px rgba(253, 185, 19, 0.3);
            }

            50% {
                box-shadow: 0 0 20px rgba(253, 185, 19, 0.6);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes progressFill {
            from {
                width: 0%;
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        .milestone-shimmer {
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.4) 50%, transparent 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        .spark-glow {
            animation: pulseGlow 2s ease-in-out infinite;
        }

        .pathway-line-bg {
            background: linear-gradient(90deg, #e5e7eb 0%, #e5e7eb 100%);
        }

        .pathway-line-fill {
            background: linear-gradient(90deg, #00A1A3, #8FAD15, #007DBA, #C8126E);
            transition: width 1.5s ease-out;
        }

        .suggestion-card {
            transition: all 0.3s ease;
        }

        .suggestion-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        /* Hide scrollbar but keep scrolling on mobile */
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        @media print {
            .no-print {
                display: none !important;
            }

            body {
                background: white !important;
            }
        }
    </style>
</head>

<body class="bg-gray-50">
    <div id="root"></div>

    <script>
        const { useState, useEffect, useMemo, useRef } = React;
        const e = React.createElement;

        // === SESSION DEFINITIONS ===
        const SPARK_SESSIONS = [
            'Adoption Strategy',
            'Digital Skills Course',
            'Facilitator Think Tank',
            'Cyber Effect Ambassador Initiation Course'
        ];

        const PATHWAY_SPARK_SESSIONS = [
            'Adoption Strategy',
            'Digital Skills Course',
            'Cyber Effect Ambassador Initiation Course'
        ];

        const DOVETAIL_SESSIONS = [
            'ePedagogy: Building a Digital Lesson',
            'Integrating digital resources from the ePortal',
            'Google Fundamentals 1: Account and Google Chrome',
            'Office Online Fundamentals',
            'Improved Presentation Skills',
            'Ease of Access with QR Codes and Bit.ly links',
            'Teaching with Videos',
            'Orientation to Google Forms',
            'AI In Education: Work Smarter, not Harder',
            'Introduction to Cyber Wellness Education'
        ];

        const MILESTONES = [
            {
                id: 'adoption',
                step: 1,
                title: 'ICT Adoption Strategy',
                subtitle: 'The Entry Point',
                icon: '🧭',
                color: '#00A1A3',
                lightColor: '#E0F7F7',
                sparkSession: 'Adoption Strategy',
                duration: '24-hour self-paced course',
                description: 'A foundational online course providing a broad perspective on the digital landscape and the "Transformation Agenda."'
            },
            {
                id: 'dovetail',
                step: 2,
                title: 'Dovetail Essentials',
                subtitle: 'Customisation & Micro-Learning',
                icon: '🧰',
                color: '#8FAD15',
                lightColor: '#F4F8E1',
                sparkSession: null,
                duration: '10 focused micro-learning sessions',
                description: 'A non-linear pathway through targeted 60-120 minute sessions building practical digital competency.'
            },
            {
                id: 'digitalskills',
                step: 3,
                title: 'Digital Skills Course',
                subtitle: 'The Experiential Shift',
                icon: '📖',
                color: '#007DBA',
                lightColor: '#E0F1FA',
                sparkSession: 'Digital Skills Course',
                duration: '4-week hybrid immersion',
                description: 'An experiential hybrid course shifting focus from "how to use" to "how to learn."'
            },
            {
                id: 'cybereffect',
                step: 4,
                title: 'Cyber Ambassador',
                subtitle: 'Ethical Capstone',
                icon: '🌐',
                color: '#C8126E',
                lightColor: '#FAE0EE',
                sparkSession: 'Cyber Effect Ambassador Initiation Course',
                duration: 'Self-paced 4-week course',
                description: 'Deepen your ability to engage with the ethical, emotional, and behavioural dimensions of technology use.'
            }
        ];

        // === UTILITIES ===
        function parseTimestamp(timestamp) {
            if (!timestamp) return null;
            try {
                const [datePart] = timestamp.split(' ');
                const [day, month, year] = datePart.split('/');
                return new Date(year, month - 1, day);
            } catch {
                return null;
            }
        }

        function formatDate(dateObj) {
            if (!dateObj) return 'N/A';
            const day = String(dateObj.getDate()).padStart(2, '0');
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const year = dateObj.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function isSpark(sessionName) {
            return SPARK_SESSIONS.includes(sessionName?.trim());
        }

        function isDovetail(sessionName) {
            return DOVETAIL_SESSIONS.includes(sessionName?.trim());
        }

        // === MILESTONE STATUS COMPONENT ===
        function MilestoneCard({ milestone, status, onClick }) {
            const statusStyles = {
                completed: {
                    border: `3px solid ${milestone.color}`,
                    background: milestone.lightColor,
                    opacity: 1
                },
                'in-progress': {
                    border: `3px solid ${milestone.color}`,
                    background: 'white',
                    opacity: 1
                },
                'not-started': {
                    border: '3px solid #e5e7eb',
                    background: '#f9fafb',
                    opacity: 0.7
                }
            };

            const statusLabel = {
                completed: { text: '✅ Completed', color: '#16a34a' },
                'in-progress': { text: '🔄 In Progress', color: '#d97706' },
                'not-started': { text: '⬜ Not Started', color: '#9ca3af' }
            };

            return e('div', {
                className: "relative flex flex-col items-center p-5 rounded-2xl transition-all shadow-sm cursor-pointer hover:shadow-md",
                style: {
                    ...statusStyles[status.state],
                    width: '220px',
                    minHeight: '280px'
                },
                onClick: onClick
            },
                e('div', {
                    className: "absolute -top-3 -left-3 w-8 h-8 rounded-full flex items-center justify-center text-white text-sm font-bold shadow",
                    style: { background: status.state === 'not-started' ? '#9ca3af' : milestone.color }
                }, milestone.step),
                e('div', { className: "text-center mb-3" },
                    e('span', {
                        className: "text-xs font-bold px-2 py-1 rounded-full",
                        style: {
                            background: status.state === 'completed' ? '#dcfce7' : status.state === 'in-progress' ? '#fef3c7' : '#f3f4f6',
                            color: statusLabel[status.state].color
                        }
                    }, statusLabel[status.state].text)
                ),
                e('div', { className: "text-4xl text-center mb-2" }, milestone.icon),
                e('h3', {
                    className: "text-sm font-bold text-center mb-1",
                    style: { color: status.state === 'not-started' ? '#9ca3af' : milestone.color }
                }, milestone.title),
                e('p', { className: "text-xs text-gray-500 text-center mb-3" }, milestone.subtitle),
                status.detail && e('div', { className: "text-xs text-center mt-auto" },
                    status.state === 'in-progress' && status.progress !== undefined && e('div', { className: "mb-1" },
                        e('div', { className: "w-full bg-gray-200 rounded-full h-2" },
                            e('div', {
                                className: "h-2 rounded-full transition-all duration-1000",
                                style: { width: `${status.progress}%`, background: milestone.color }
                            })
                        )
                    ),
                    e('span', { className: "text-gray-600" }, status.detail)
                ),
                status.completedDate && e('div', { className: "text-xs text-green-700 text-center mt-2 font-medium" }, `📅 ${status.completedDate}`),
                milestone.step < 5 && status.state === 'completed' && e('div', { className: "text-center mt-2" },
                    e('span', { className: "inline-block bg-gradient-to-r from-yellow-400 to-orange-400 text-black text-xs font-bold px-2 py-1 rounded-full shadow" }, "⭐ Spark Earned")
                )
            );
        }

        // === SUGGESTION CARD ===
        function SuggestionCard({ icon, title, description, type, sessions, linkText, linkHref, onSessionClick }) {
            const typeColors = {
                action: { bg: 'bg-blue-50', border: 'border-blue-200', icon: 'text-blue-600' },
                progress: { bg: 'bg-amber-50', border: 'border-amber-200', icon: 'text-amber-600' },
                invitation: { bg: 'bg-purple-50', border: 'border-purple-200', icon: 'text-purple-600' },
                celebration: { bg: 'bg-green-50', border: 'border-green-200', icon: 'text-green-600' },
                info: { bg: 'bg-gray-50', border: 'border-gray-200', icon: 'text-gray-600' }
            };
            const colors = typeColors[type] || typeColors.info;

            return e('div', { className: `suggestion-card rounded-xl p-5 border-2 overflow-hidden ${colors.bg} ${colors.border}` },
                e('div', { className: "flex items-start gap-3 min-w-0" },
                    e('span', { className: "text-2xl flex-shrink-0" }, icon),
                    e('div', { className: "flex-1 min-w-0" },
                        e('h4', { className: "font-bold text-gray-900 mb-1" }, title),
                        e('p', { className: "text-sm text-gray-700 mb-2" }, description),
                        sessions && sessions.length > 0 && e('div', { className: "mt-3 overflow-hidden" },
                            e('p', { className: "text-xs font-semibold text-gray-500 uppercase mb-2" }, "Upcoming sessions you could attend:"),
                            e('div', { className: "space-y-1.5" },
                                sessions.slice(0, 4).map((s, i) => e('div', {
                                    key: i,
                                    className: "flex items-center gap-2 text-xs bg-white rounded-lg px-3 py-2 border border-gray-100 cursor-pointer hover:border-wcg-blue hover:bg-blue-50 transition-colors min-w-0",
                                    onClick: () => onSessionClick && onSessionClick(s)
                                },
                                    e('span', { className: "text-gray-400 flex-shrink-0" }, "📅"),
                                    e('span', { className: "font-medium text-gray-800 flex-shrink-0" }, s.date),
                                    e('span', { className: "text-gray-400 flex-shrink-0" }, "•"),
                                    e('span', { className: "text-gray-700 flex-1 truncate" }, s.name),
                                    e('span', { className: "text-wcg-blue flex-shrink-0 text-sm" }, "›")
                                )),
                                sessions.length > 4 && e('p', { className: "text-xs text-gray-500 italic" }, `+ ${sessions.length - 4} more sessions available`)
                            )
                        ),
                        linkText && linkHref && e('a', { href: linkHref, className: "inline-block mt-2 text-sm font-semibold text-wcg-blue hover:underline" }, `${linkText} →`)
                    )
                )
            );
        }

        // === UPCOMING SESSION MODAL ===
        function UpcomingSessionModal({ session, onClose }) {
            if (!session) return null;

            const formatOutcomes = (text) => {
                if (!text) return null;
                const items = text.split(/\n|⮚|>/).filter(item => item.trim().length > 0);
                if (items.length <= 1) return e('p', { className: "text-gray-600 text-sm mt-2" }, text);
                return e('ul', { className: "mt-2 space-y-1.5" },
                    items.map((item, idx) => e('li', { key: idx, className: "text-gray-600 text-sm flex items-start" },
                        e('span', { className: "mr-2 mt-1.5 w-1.5 h-1.5 bg-wcg-blue rounded-full flex-shrink-0" }),
                        e('span', null, item.trim())
                    ))
                );
            };

            const getLevelColor = (level) => {
                if (!level) return 'bg-gray-100 text-gray-700 border-gray-200';
                const l = level.toLowerCase();
                if (l.includes('foundation')) return 'bg-wcg-green text-white border-wcg-green';
                if (l.includes('better')) return 'bg-wcg-red text-white border-wcg-red';
                if (l.includes('i can')) return 'bg-wcg-yellow text-black border-wcg-yellow';
                if (l.includes('summit')) return 'bg-wcg-blue text-white border-wcg-blue';
                return 'bg-gray-100 text-gray-700 border-gray-200';
            };

            return e('div', {
                className: "fixed inset-0 z-50 flex items-center justify-center p-4",
                style: { backgroundColor: 'rgba(0,0,0,0.5)' },
                onClick: onClose
            },
                e('div', { className: "bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto", onClick: ev => ev.stopPropagation() },
                    e('div', { className: "bg-gray-50 border-b border-gray-100 p-4 rounded-t-2xl flex justify-between items-center" },
                        e('div', null,
                            e('div', { className: "flex items-center gap-2 text-wcg-blue font-bold" },
                                e('span', null, "📅"),
                                e('span', null, session.date || 'TBA')
                            ),
                            session.time && e('div', { className: "flex items-center gap-2 text-gray-600 text-sm mt-1 ml-6" },
                                e('span', null, "🕐"),
                                e('span', null, session.time)
                            )
                        ),
                        e('button', { onClick: onClose, className: "text-gray-400 hover:text-gray-600 text-2xl leading-none" }, "×")
                    ),
                    e('div', { className: "p-5" },
                        e('div', { className: "flex flex-wrap gap-2 mb-3" },
                            session.level && e('span', { className: `px-2 py-0.5 rounded-md text-xs font-bold uppercase tracking-wide border ${getLevelColor(session.level)}` }, session.level),
                            session.district && e('span', { className: "px-2 py-0.5 rounded-md text-xs font-bold uppercase tracking-wide bg-white text-wcg-blue border border-wcg-blue/30" }, session.district)
                        ),
                        e('h3', { className: "text-lg font-bold text-gray-900 mb-3" }, session.name),
                        session.description && e('div', { className: "text-gray-600 text-sm leading-relaxed mb-4" }, session.description),
                        session.outcomes && e('div', { className: "bg-blue-50/50 rounded-lg p-3 mb-4" },
                            e('h4', { className: "text-xs font-bold text-gray-500 uppercase tracking-wider mb-2" }, "Learning Outcomes"),
                            formatOutcomes(session.outcomes)
                        )
                    ),
                    e('div', { className: "p-4 border-t border-gray-100 space-y-2" },
                        session.registerLink && e('a', {
                            href: session.registerLink,
                            target: "_blank",
                            rel: "noopener noreferrer",
                            className: "flex items-center justify-center bg-wcg-blue hover:bg-blue-800 text-white font-bold py-2.5 px-4 rounded-lg transition-all text-sm shadow-sm w-full"
                        }, "Register Now ↗"),
                        e('div', { className: "grid grid-cols-2 gap-2" },
                            session.googleCal && session.googleCal !== '#' && e('a', { href: session.googleCal, target: "_blank", rel: "noreferrer", className: "flex items-center justify-center bg-white border border-gray-200 hover:border-wcg-blue text-gray-600 font-medium py-2 px-2 rounded-lg text-xs transition-colors" }, "📅 Add to Google"),
                            session.outlookCal && session.outlookCal !== '#' && e('a', { href: session.outlookCal, target: "_blank", rel: "noreferrer", className: "flex items-center justify-center bg-white border border-gray-200 hover:border-wcg-blue text-gray-600 font-medium py-2 px-2 rounded-lg text-xs transition-colors" }, "📧 Add to Outlook")
                        )
                    )
                )
            );
        }

        const TRANSFORMATION_ARC_SESSIONS = [
            'Facilitator Think Tank',
            'Elevate',
            'Shift and Spark'
        ];

        const DATA_LAST_UPDATED = '05 June 2026';

        // === TRANSFORMATION ARC CARD ===
        function TransformationARCCard({ hasThinkTank, arcSessions, totalSessions }) {
            const arcCount = arcSessions.length;
            const hasElevate = arcSessions.includes('Elevate');
            const hasShiftAndSpark = arcSessions.includes('Shift and Spark');

            return e('div', { className: `rounded-xl p-5 border-2 border-dashed ${hasThinkTank ? 'border-purple-300 bg-purple-50' : 'border-gray-300 bg-gray-50 opacity-60'}` },
                e('div', { className: "flex items-start gap-3" },
                    e('span', { className: "text-2xl" }, "🎓"),
                    e('div', { className: "flex-1" },
                        e('div', { className: "flex items-center gap-2 mb-1" },
                            e('h4', { className: "font-bold text-gray-700" }, "Transformation ARC"),
                            hasThinkTank ? e('span', { className: "text-xs bg-purple-200 text-purple-800 px-2 py-0.5 rounded-full font-semibold" }, `${arcCount} Step${arcCount > 1 ? 's' : ''} Complete`) : e('span', { className: "text-xs bg-gray-200 text-gray-500 px-2 py-0.5 rounded-full font-semibold" }, "By Invitation")
                        ),
                        e('p', { className: "text-sm text-gray-600 mb-2" },
                            hasThinkTank
                                ? "You've entered the Transformation ARC — a specialised developmental pathway. The Facilitator Think Tank is the first step and earns a Spark."
                                : "The Facilitator Think Tank is the entry point to the Transformation ARC — a specialised developmental pathway by invitation. Teachers with strong PD engagement are often considered."
                        ),
                        hasThinkTank && e('div', { className: "space-y-1.5 mb-2" },
                            [
                                { name: 'Facilitator Think Tank', done: true, label: 'Step 1 • ⭐ Spark' },
                                { name: 'Elevate', done: hasElevate, label: 'Step 2' },
                                { name: 'Shift and Spark', done: hasShiftAndSpark, label: 'Step 3' }
                            ].map((step, idx) => e('div', { key: idx, className: `flex items-center gap-2 p-1.5 rounded-lg text-xs font-medium ${step.done ? 'bg-purple-100 text-purple-800' : 'bg-gray-100 text-gray-400'}` },
                                e('span', null, step.done ? '✅' : '⬜'),
                                e('span', null, step.name),
                                e('span', { className: "ml-auto opacity-70" }, step.label)
                            ))
                        ),
                        hasThinkTank && e('span', { className: "inline-block bg-gradient-to-r from-yellow-400 to-orange-400 text-black text-xs font-bold px-2 py-1 rounded-full shadow" }, `⭐ Spark Earned ${arcCount > 1 ? `• ${arcCount} ARC Steps Complete` : ''}`),
                        !hasThinkTank && totalSessions >= 15 && e('p', { className: "text-xs text-purple-600 mt-1 font-medium" }, `💡 Your strong PD engagement (${totalSessions} sessions) means you could be considered for future invitations.`)
                    )
                )
            );
        }

        // === MAIN APP ===
        function App() {
            const [attendanceData, setAttendanceData] = useState([]);
            const [upcomingData, setUpcomingData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchType, setSearchType] = useState('persal');
            const [searchValue, setSearchValue] = useState('');
            const [acknowledged, setAcknowledged] = useState(false);
            const [results, setResults] = useState(null);
            const [selectedMilestone, setSelectedMilestone] = useState(null);
            const [menuOpen, setMenuOpen] = useState(false);
            const [selectedSession, setSelectedSession] = useState(null);

            useEffect(() => {
                let loaded = 0;
                const checkDone = () => {
                    if (++loaded >= 2) setLoading(false);
                };
                Papa.parse('attendance.csv', {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: (result) => {
                        setAttendanceData(result.data);
                        checkDone();
                    },
                    error: () => checkDone()
                });
                // Updated CSV filename path target here:
                Papa.parse('upcoming-sessions.csv', {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: (result) => {
                        setUpcomingData(result.data);
                        checkDone();
                    },
                    error: () => checkDone()
                });
            }, []);

            useEffect(() => {
                if (!loading && attendanceData.length > 0 && !results) {
                    try {
                        const saved = JSON.parse(localStorage.getItem('wced_pd_credentials') || 'null');
                        if (saved && saved.searchType && saved.searchValue) {
                            const searchKey = saved.searchValue.trim();
                            const idIndex = {};
                            const persalIndex = {};
                            attendanceData.forEach(record => {
                                const id = record['ID/Passport Number']?.trim();
                                const persal = record['PERSAL Number']?.trim();
                                if (id) {
                                    if (!idIndex[id]) idIndex[id] = [];
                                    idIndex[id].push(record);
                                }
                                if (persal) {
                                    if (!persalIndex[persal]) persalIndex[persal] = [];
                                    persalIndex[persal].push(record);
                                }
                            });
                            const records = saved.searchType === 'id' ? (idIndex[searchKey] || []) : (persalIndex[searchKey] || []);
                            if (records.length > 0) {
                                const sortedRecords = [...records].sort((a, b) => parseTimestamp(b.Timestamp) - parseTimestamp(a.Timestamp));
                                const mostRecent = sortedRecords[0];
                                const seenSessions = new Set();
                                const uniqueSessions = sortedRecords
                                    .filter(record => {
                                        const key = `${record['Session Name']}_${record.Timestamp}`;
                                        if (seenSessions.has(key)) return false;
                                        seenSessions.add(key);
                                        return true;
                                    })
                                    .map(record => ({
                                        ...record,
                                        parsedDate: parseTimestamp(record.Timestamp),
                                        isSpark: isSpark(record['Session Name']),
                                        isDovetail: isDovetail(record['Session Name'])
                                    }));
                                setSearchType(saved.searchType);
                                setSearchValue(saved.searchValue);
                                setAcknowledged(true);
                                setResults({
                                    profile: {
                                        name: `${mostRecent['First Name']} ${mostRecent['Surname']}`.trim(),
                                        school: mostRecent['School'] || 'N/A',
                                        district: mostRecent['District'] || 'N/A'
                                    },
                                    sessions: uniqueSessions
                                });
                            }
                        }
                    } catch (e) { /* ignore */ }
                }
            }, [loading, attendanceData]);

            const indexes = useMemo(() => {
                const idIndex = {};
                const persalIndex = {};
                attendanceData.forEach(record => {
                    const id = record['ID/Passport Number']?.trim();
                    const persal = record['PERSAL Number']?.trim();
                    if (id) {
                        if (!idIndex[id]) idIndex[id] = [];
                        idIndex[id].push(record);
                    }
                    if (persal) {
                        if (!persalIndex[persal]) persalIndex[persal] = [];
                        persalIndex[persal].push(record);
                    }
                });
                return { idIndex, persalIndex };
            }, [attendanceData]);

            const handleSearch = () => {
                if (!searchValue.trim() || !acknowledged) return;
                const searchKey = searchValue.trim();
                let records = searchType === 'id' ? (indexes.idIndex[searchKey] || []) : (indexes.persalIndex[searchKey] || []);
                if (records.length === 0) {
                    setResults({ profile: null, sessions: [] });
                    return;
                }
                const sortedRecords = [...records].sort((a, b) => parseTimestamp(b.Timestamp) - parseTimestamp(a.Timestamp));
                const mostRecent = sortedRecords[0];
                const profile = {
                    name: `${mostRecent['First Name']} ${mostRecent['Surname']}`.trim(),
                    school: mostRecent['School'] || 'N/A',
                    district: mostRecent['District'] || 'N/A'
                };
                const seenSessions = new Set();
                const uniqueSessions = sortedRecords
                    .filter(record => {
                        const key = `${record['Session Name']}_${record.Timestamp}`;
                        if (seenSessions.has(key)) return false;
                        seenSessions.add(key);
                        return true;
                    })
                    .map(record => ({
                        ...record,
                        parsedDate: parseTimestamp(record.Timestamp),
                        isSpark: isSpark(record['Session Name']),
                        isDovetail: isDovetail(record['Session Name'])
                    }));
                setResults({ profile, sessions: uniqueSessions });
                localStorage.setItem('wced_pd_credentials', JSON.stringify({ searchType, searchValue: searchKey }));
            };

            const pathwayStatus = useMemo(() => {
                if (!results || !results.sessions) return null;
                const sessions = results.sessions;
                const sessionNames = [...new Set(sessions.map(s => s['Session Name']?.trim()).filter(Boolean))];

                const hasAdoption = sessionNames.includes('Adoption Strategy');
                const hasDigitalSkills = sessionNames.includes('Digital Skills Course');
                const hasCyberEffect = sessionNames.includes('Cyber Effect Ambassador Initiation Course');
                const hasThinkTank = sessionNames.includes('Facilitator Think Tank');

                const arcSessions = TRANSFORMATION_ARC_SESSIONS.filter(s => sessionNames.includes(s));
                const completedDovetails = DOVETAIL_SESSIONS.filter(d => sessionNames.includes(d));
                const dovetailCount = completedDovetails.length;
                const remainingDovetails = DOVETAIL_SESSIONS.filter(d => !sessionNames.includes(d));
                const hasDovetailSpark = dovetailCount >= 5;

                let sparkCount = 0;
                if (hasAdoption) sparkCount++;
                if (hasDigitalSkills) sparkCount++;
                if (hasCyberEffect) sparkCount++;
                if (hasThinkTank) sparkCount++;
                if (hasDovetailSpark) sparkCount++;

                const findCompletionDate = (sName) => {
                    const matching = sessions.filter(s => s['Session Name']?.trim() === sName);
                    if (matching.length === 0) return null;
                    const sorted = [...matching].sort((a, b) => parseTimestamp(a.Timestamp) - parseTimestamp(b.Timestamp));
                    return sorted[0].Timestamp ? sorted[0].Timestamp.split(' ')[0] : null;
                };

                const milestoneStatuses = [
                    {
                        state: hasAdoption ? 'completed' : 'not-started',
                        detail: hasAdoption ? 'Pathway Requirement Met' : 'Prerequisite for formal pathway tracking',
                        completedDate: findCompletionDate('Adoption Strategy')
                    },
                    {
                        state: hasDovetailSpark ? 'completed' : (dovetailCount > 0 ? 'in-progress' : 'not-started'),
                        detail: hasDovetailSpark ? `Completed ${dovetailCount} Essentials` : `${dovetailCount}/5 required for Spark`,
                        progress: Math.min((dovetailCount / 5) * 100, 100)
                    },
                    {
                        state: hasDigitalSkills ? 'completed' : 'not-started',
                        detail: hasDigitalSkills ? 'Pathway Requirement Met' : 'Core progression step',
                        completedDate: findCompletionDate('Digital Skills Course')
                    },
                    {
                        state: hasCyberEffect ? 'completed' : 'not-started',
                        detail: hasCyberEffect ? 'Pathway Requirement Met' : 'Final milestone',
                        completedDate: findCompletionDate('Cyber Effect Ambassador Initiation Course')
                    }
                ];

                const upcomingGrouped = {};
                upcomingData.forEach(s => {
                    const name = s['Session Name']?.trim();
                    if (!name) return;
                    if (!upcomingGrouped[name]) upcomingGrouped[name] = [];
                    upcomingGrouped[name].push({
                        name: name,
                        date: s['Date'] || 'TBA',
                        time: s['Time'] || '',
                        level: s['Level'] || '',
                        district: s['District'] || '',
                        description: s['Description'] || '',
                        outcomes: s['Learning Outcomes'] || '',
                        registerLink: s['Registration Link'] || '',
                        googleCal: s['Google Calendar Link'] || '#',
                        outlookCal: s['Outlook Calendar Link'] || '#'
                    });
                });

                const recommendations = [];
                if (!hasAdoption) {
                    recommendations.push({
                        icon: '🧭',
                        title: 'Kickstart Your Journey',
                        description: 'Complete the ICT Adoption Strategy course to unlock the core elements of the transformation pathway.',
                        type: 'action',
                        sessions: upcomingGrouped['Adoption Strategy'] || []
                    });
                }
                if (dovetailCount < 5) {
                    recommendations.push({
                        icon: '🧰',
                        title: 'Level Up Your Micro-Competencies',
                        description: `Attend ${5 - dovetailCount} more Dovetail Essentials micro-learning sessions to secure your Dovetail Spark.`,
                        type: 'progress',
                        sessions: remainingDovetails.flatMap(d => upcomingGrouped[d] || [])
                    });
                }
                if (hasAdoption && !hasDigitalSkills) {
                    recommendations.push({
                        icon: '📖',
                        title: 'Prepare for the Experiential Shift',
                        description: 'Enrol in the next available Digital Skills Course hybrid session to deepen your practice.',
                        type: 'action',
                        sessions: upcomingGrouped['Digital Skills Course'] || []
                    });
                }
                if (hasDigitalSkills && !hasCyberEffect) {
                    recommendations.push({
                        icon: '🌐',
                        title: 'Complete the Capstone',
                        description: 'Take the Cyber Ambassador course to finalise your pathway progression.',
                        type: 'action',
                        sessions: upcomingGrouped['Cyber Effect Ambassador Initiation Course'] || []
                    });
                }

                return { sparkCount, milestoneStatuses, recommendations, hasThinkTank, arcSessions };
            }, [results, upcomingData]);

            return e('div', { className: "min-h-screen pb-12" },
                e('header', { className: "bg-white border-b border-gray-200 sticky top-0 z-40 no-print" },
                    e('div', { className: "max-w-7xl mx-auto px-4 h-16 flex items-center justify-between" },
                        e('div', { className: "flex items-center gap-3" },
                            e('div', { className: "w-8 h-8 rounded-lg bg-wcg-blue flex items-center justify-center font-bold text-white" }, "WC"),
                            e('h1', { className: "font-bold text-gray-900 tracking-tight" }, "My PD Journey")
                        ),
                        e('nav', { className: "hidden md:flex items-center gap-6 text-sm font-medium text-gray-600" },
                            e('a', { href: "index.html", className: "hover:text-wcg-blue" }, "All Sessions"),
                            e('a', { href: "calendar.html", className: "hover:text-wcg-blue" }, "Calendar View"),
                            e('a', { href: "my-pd-history.html", className: "hover:text-wcg-blue" }, "PD History"),
                            e('a', { href: "my-journey.html", className: "text-wcg-blue font-bold border-b-2 border-wcg-blue pb-5 pt-5" }, "My Journey")
                        )
                    )
                ),
                e('main', { className: "max-w-7xl mx-auto px-4 mt-8" },
                    !results ? e('div', { className: "max-w-md mx-auto bg-white rounded-2xl shadow-sm p-6 border border-gray-200 mt-12" },
                        e('h2', { className: "text-xl font-bold text-gray-900 mb-2" }, "Access Your Pathway"),
                        e('p', { className: "text-sm text-gray-600 mb-4" }, "Enter your tracking credentials to see your earned sparks and custom developmental milestones."),
                        e('div', { className: "space-y-4" },
                            e('div', { className: "flex gap-4 p-1 bg-gray-100 rounded-lg" },
                                e('button', {
                                    className: `flex-1 py-1.5 text-xs font-semibold rounded-md transition-all ${searchType === 'persal' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-900'}`,
                                    onClick: () => setSearchType('persal')
                                }, "PERSAL Number"),
                                e('button', {
                                    className: `flex-1 py-1.5 text-xs font-semibold rounded-md transition-all ${searchType === 'id' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-900'}`,
                                    onClick: () => setSearchType('id')
                                }, "ID/Passport")
                            ),
                            e('input', {
                                type: "text",
                                placeholder: searchType === 'persal' ? "e.g., 12345678" : "e.g., 8501015123081",
                                className: "w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-wcg-blue",
                                value: searchValue,
                                onChange: (ev) => setSearchValue(ev.target.value)
                            }),
                            e('div', { className: "flex items-start gap-2.5 p-3 bg-amber-50 rounded-lg border border-amber-200 text-xs text-amber-800" },
                                e('input', {
                                    type: "checkbox",
                                    id: "ack",
                                    className: "mt-0.5",
                                    checked: acknowledged,
                                    onChange: (ev) => setAcknowledged(ev.target.checked)
                                }),
                                e('label', { htmlFor: "ack", className: "cursor-pointer select-none leading-normal" }, "I consent to this browser securely loading my professional development records.")
                            ),
                            e('button', {
                                className: "w-full bg-wcg-blue text-white py-2 rounded-lg text-sm font-bold shadow-sm hover:bg-blue-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed",
                                disabled: !searchValue.trim() || !acknowledged,
                                onClick: handleSearch
                            }, "View My Journey")
                        )
                    ) : e('div', { className: "space-y-8 animate-fade-in-up" },
                        e('div', { className: "bg-white rounded-2xl p-6 shadow-sm border border-gray-200 flex flex-col md:flex-row md:items-center justify-between gap-4" },
                            e('div', null,
                                e('p', { className: "text-xs font-bold uppercase tracking-wider text-gray-400 mb-1" }, "Teacher Pathway Profile"),
                                e('h2', { className: "text-2xl font-bold text-gray-900" }, results.profile.name),
                                e('p', { className: "text-sm text-gray-600 mt-1" }, `${results.profile.school} • ${results.profile.district}`)
                            ),
                            pathwayStatus && e('div', { className: "flex items-center gap-4 bg-gray-50 px-6 py-4 rounded-xl border border-gray-100" },
                                e('div', { className: "text-center" },
                                    e('p', { className: "text-[2.5rem] leading-none mb-1 font-black text-wcg-blue" }, pathwayStatus.sparkCount),
                                    e('p', { className: "text-[0.65rem] font-bold uppercase tracking-widest text-gray-400" }, "Sparks Earned")
                                ),
                                e('div', { className: "text-[2rem]" }, "⚡")
                            )
                        ),
                        pathwayStatus && e('div', { className: "bg-white rounded-2xl p-6 shadow-sm border border-gray-200" },
                            e('h3', { className: "text-lg font-bold text-gray-900 mb-6" }, "Core Progression Milestones"),
                            e('div', { className: "flex gap-6 overflow-x-auto pb-4 hide-scrollbar justify-start" },
                                MILESTONES.map((milestone, idx) => e(MilestoneCard, {
                                    key: milestone.id,
                                    milestone: milestone,
                                    status: pathwayStatus.milestoneStatuses[idx],
                                    onClick: () => setSelectedMilestone(idx)
                                }))
                            )
                        ),
                        pathwayStatus && e('div', { className: "grid grid-cols-1 lg:grid-cols-3 gap-8" },
                            e('div', { className: "lg:col-span-2 space-y-4" },
                                e('h3', { className: "text-lg font-bold text-gray-900 mb-2" }, "Personalised Opportunities"),
                                pathwayStatus.recommendations.length === 0 ? e('p', { className: "text-sm text-gray-500 italic p-4 bg-gray-50 rounded-xl" }, "🎉 Magnificent work! You have hit all critical milestones on the core adoption pathway.") : pathwayStatus.recommendations.map((rec, i) => e(SuggestionCard, {
                                    key: i,
                                    icon: rec.icon,
                                    title: rec.title,
                                    description: rec.description,
                                    type: rec.type,
                                    sessions: rec.sessions,
                                    onSessionClick: (s) => setSelectedSession(s)
                                }))
                            ),
                            e('div', { className: "space-y-4" },
                                e('h3', { className: "text-lg font-bold text-gray-900 mb-2" }, "Specialised Development"),
                                e(TransformationARCCard, {
                                    hasThinkTank: pathwayStatus.hasThinkTank,
                                    arcSessions: pathwayStatus.arcSessions,
                                    totalSessions: results.sessions.length
                                })
                            )
                        )
                    )
                ),
                selectedMilestone !== null && pathwayStatus && e('div', {
                    className: "fixed inset-0 z-50 flex items-center justify-center p-4",
                    style: { backgroundColor: 'rgba(0,0,0,0.5)' },
                    onClick: () => setSelectedMilestone(null)
                },
                    e('div', { className: "bg-white rounded-2xl shadow-2xl max-w-md w-full p-6", onClick: (ev) => ev.stopPropagation() },
                        e('div', { className: "flex items-start justify-between mb-4" },
                            e('div', { className: "flex items-center gap-3" },
                                e('span', { className: "text-3xl" }, MILESTONES[selectedMilestone].icon),
                                e('div', null,
                                    e('h4', { className: "font-bold text-gray-900 text-lg" }, MILESTONES[selectedMilestone].title),
                                    e('p', { className: "text-xs text-gray-500 font-medium" }, MILESTONES[selectedMilestone].duration)
                                )
                            ),
                            e('button', { onClick: () => setSelectedMilestone(null), className: "text-gray-400 hover:text-gray-600 text-2xl leading-none" }, "×")
                        ),
                        e('p', { className: "text-sm text-gray-600 leading-relaxed mb-4" }, MILESTONES[selectedMilestone].description),
                        e('div', { className: "bg-gray-50 rounded-xl p-4 border border-gray-100 text-xs" },
                            e('span', { className: "font-bold uppercase tracking-wider text-gray-400 block mb-1" }, "Your Status"),
                            e('p', { className: "font-semibold text-gray-800" }, pathwayStatus.milestoneStatuses[selectedMilestone].detail),
                            pathwayStatus.milestoneStatuses[selectedMilestone].completedDate && e('p', { className: "text-green-700 font-medium mt-1.5" }, `📅 Completed on ${pathwayStatus.milestoneStatuses[selectedMilestone].completedDate}`)
                        )
                    )
                ),
                selectedSession && e(UpcomingSessionModal, {
                    session: selectedSession,
                    onClose: () => setSelectedSession(null)
                })
            );
        }

        ReactDOM.render(e(App), document.getElementById('root'));
    </script>
</body>

</html>
