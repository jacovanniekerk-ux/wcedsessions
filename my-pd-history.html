<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PD History - WCED Professional Development</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'wcg-green': '#76B82A',
                        'wcg-yellow': '#FDB913',
                        'wcg-red': '#E30613',
                        'wcg-blue': '#001489',
                        'wcg-purple': '#672D82',
                        'wcg-pink': '#C8126E',
                        'wcg-dark': '#1a1a1a',
                        'wcg-gray': '#666666'
                    },
                    fontFamily: {
                        'sans': ['Century Gothic', 'Arial', 'Helvetica', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            .no-print {
                display: none !important;
            }

            body {
                background: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .print-full-width {
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            
            @page {
                margin: 1cm;
            }
        }

        .spark-overlay {
            background: linear-gradient(135deg, rgba(253, 185, 19, 0.05) 0%, rgba(253, 185, 19, 0.1) 100%);
        }

        .dovetail-overlay {
            background: linear-gradient(135deg, rgba(200, 18, 110, 0.05) 0%, rgba(200, 18, 110, 0.1) 100%);
        }

        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body class="bg-gray-50">
    <div id="root"></div>

    <script>
        const { useState, useEffect, useMemo } = React;
        const e = React.createElement;

        // Sparks sessions
        const SPARK_SESSIONS = [
            'Adoption Strategy',
            'Digital Skills Course',
            'Facilitator Think Tank',
            'Cyber Effect Ambassador Initiation Course'
        ];

        // Dovetail Essentials sessions
        const DOVETAIL_SESSIONS = [
            'ePedagogy: Building a Digital Lesson',
            'Integrating digital resources from the ePortal',
            'Google Fundamentals 1: Account and Google Chrome',
            'Office Online Fundamentals',
            'Improved Presentation Skills',
            'Ease of Access with QR Codes and Bit.ly links',
            'Teaching with Videos',
            'Orientation to Google Forms',
            'AI In Education: Work Smarter, not Harder',
            'Introduction to Cyber Wellness Education'
        ];

        // Utility: Parse DD/MM/YYYY HH:MM:SS format
        function parseTimestamp(timestamp) {
            if (!timestamp) return null;
            try {
                const [datePart] = timestamp.split(' ');
                const [day, month, year] = datePart.split('/');
                return new Date(year, month - 1, day);
            } catch {
                return null;
            }
        }

        // Utility: Format date for display
        function formatDate(dateObj) {
            if (!dateObj) return 'N/A';
            const day = String(dateObj.getDate()).padStart(2, '0');
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const year = dateObj.getFullYear();
            return `${day}/${month}/${year}`;
        }

        // Utility: Get development level color
        function getLevelColor(level) {
            if (!level) return 'bg-gray-200 text-gray-800';
            const normalized = level.toLowerCase().trim();
            if (normalized === 'laying the foundation') return 'bg-wcg-green text-white';
            if (normalized === 'i can do it') return 'bg-wcg-yellow text-black';
            if (normalized === 'i can do it better') return 'bg-wcg-red text-white';
            if (normalized === 'the summit') return 'bg-wcg-blue text-white';
            return 'bg-gray-200 text-gray-800';
        }

        // Utility: Check if session is a Spark
        function isSpark(sessionName) {
            return SPARK_SESSIONS.includes(sessionName?.trim());
        }

        // Utility: Check if session is Dovetail Essential
        function isDovetail(sessionName) {
            return DOVETAIL_SESSIONS.includes(sessionName?.trim());
        }

        // === DATA LAST UPDATED ===
        const DATA_LAST_UPDATED = '05 June 2026';

        // Checklist Modal Component
        function ChecklistModal({ isOpen, onClose, type, completedSessions, allSessions }) {
            if (!isOpen) return null;

            const title = type === 'spark' ? '⭐ Spark Sessions' : '💎 Dovetail Essentials';

            // For Sparks, check if they have bonus spark
            const uniqueDovetails = type === 'spark'
                ? [...new Set(allSessions.filter(s => isDovetail(s['Session Name']?.trim())).map(s => s['Session Name']?.trim()))]
                : [];
            const bonus5Dovetail = type === 'spark' && uniqueDovetails.length >= 5;

            const sessionsList = type === 'spark' ? SPARK_SESSIONS : DOVETAIL_SESSIONS;

            return e('div', {
                className: "fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop no-print",
                onClick: onClose
            },
                e('div', {
                    className: "bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[80vh] overflow-hidden",
                    onClick: e => e.stopPropagation()
                },
                    e('div', { className: "p-6 border-b border-gray-200" },
                        e('div', { className: "flex justify-between items-center" },
                            e('h3', { className: "text-2xl font-bold text-wcg-dark" }, title),
                            e('button', {
                                onClick: onClose,
                                className: "text-gray-400 hover:text-gray-600 text-2xl leading-none"
                            }, "×")
                        )
                    ),
                    e('div', { className: "p-6 overflow-y-auto max-h-[60vh]" },
                        e('div', { className: "space-y-3" },
                            sessionsList.map((session, idx) => {
                                const isCompleted = completedSessions.includes(session);
                                return e('div', {
                                    key: idx,
                                    className: `flex items-start gap-3 p-3 rounded-lg border-2 ${isCompleted ? 'border-green-500 bg-green-50' : 'border-gray-300 bg-gray-50'}`
                                },
                                    e('div', {
                                        className: `flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center ${isCompleted ? 'bg-green-500' : 'bg-gray-300'}`
                                    },
                                        isCompleted && e('svg', { className: "w-4 h-4 text-white", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
                                            e('path', { strokeLinecap: "round", strokeLinejoin="round", strokeWidth: 3, d: "M5 13l4 4L19 7" })
                                        )
                                    ),
                                    e('span', { className: `flex-1 ${isCompleted ? 'text-green-900 font-medium' : 'text-gray-500'}` }, session)
                                );
                            }),

                            type === 'spark' && e('div', {
                                className: `flex items-start gap-3 p-3 rounded-lg border-2 mt-4 ${bonus5Dovetail ? 'border-green-500 bg-green-50' : 'border-gray-300 bg-gray-50'}`
                            },
                                e('div', {
                                    className: `flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center ${bonus5Dovetail ? 'bg-green-500' : 'bg-gray-300'}`
                                },
                                    bonus5Dovetail && e('svg', { className: "w-4 h-4 text-white", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
                                        e('path', { strokeLinecap: "round", strokeLinejoin="round", strokeWidth: 3, d: "M5 13l4 4L19 7" })
                                    )
                                ),
                                e('span', { className: `flex-1 ${bonus5Dovetail ? 'text-green-900 font-medium' : 'text-gray-500'}` },
                                    e('strong', null, "Bonus Spark:"),
                                    ` Complete 5+ Dovetail Essentials (${uniqueDovetails.length}/5)`
                                )
                            )
                        )
                    )
                )
            );
        }

        function App() {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchType, setSearchType] = useState('id');
            const [searchValue, setSearchValue] = useState('');
            const [acknowledged, setAcknowledged] = useState(false);
            const [results, setResults] = useState(null);
            const [viewMode, setViewMode] = useState('cards');
            const [filters, setFilters] = useState({ level: '', district: '', mode: '', category: '' });
            const [modalOpen, setModalOpen] = useState({ isOpen: false, type: null });
            const [menuOpen, setMenuOpen] = useState(false);

            // Load CSV on mount
            useEffect(() => {
                Papa.parse('attendance.csv', {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: (result) => {
                        setData(result.data);
                        setLoading(false);
                    },
                    error: (error) => {
                        console.error('Error loading CSV:', error);
                        setLoading(false);
                    }
                });
            }, []);

            // Auto-login from localStorage
            useEffect(() => {
                if (!loading && data.length > 0 && !results) {
                    try {
                        const saved = JSON.parse(localStorage.getItem('wced_pd_credentials') || 'null');
                        if (saved && saved.searchType && saved.searchValue) {
                            const searchKey = saved.searchValue.trim();
                            const idIndex = {};
                            const persalIndex = {};
                            data.forEach(record => {
                                const id = record['ID/Passport Number']?.trim();
                                const persal = record['PERSAL Number']?.trim();
                                if (id) { if (!idIndex[id]) idIndex[id] = []; idIndex[id].push(record); }
                                if (persal) { if (!persalIndex[persal]) persalIndex[persal] = []; persalIndex[persal].push(record); }
                            });
                            const records = saved.searchType === 'id' ? (idIndex[searchKey] || []) : (persalIndex[searchKey] || []);
                            if (records.length > 0) {
                                const sortedRecords = [...records].sort((a, b) => parseTimestamp(b.Timestamp) - parseTimestamp(a.Timestamp));
                                const mostRecent = sortedRecords[0];
                                const seenSessions = new Set();
                                const uniqueSessions = sortedRecords
                                    .filter(record => {
                                        const key = `${record['Session Name']}_${record.Timestamp}`;
                                        if (seenSessions.has(key)) return false;
                                        seenSessions.add(key);
                                        return true;
                                    })
                                    .map(record => ({
                                        ...record,
                                        parsedDate: parseTimestamp(record.Timestamp),
                                        year: parseTimestamp(record.Timestamp)?.getFullYear() || 'Unknown',
                                        isSpark: isSpark(record['Session Name']),
                                        isDovetail: isDovetail(record['Session Name'])
                                    }));
                                setSearchType(saved.searchType);
                                setSearchValue(saved.searchValue);
                                setAcknowledged(true);
                                setResults({
                                    profile: {
                                        name: `${mostRecent['First Name']} ${mostRecent['Surname']}`.trim(),
                                        school: mostRecent['School'] || 'N/A',
                                        district: mostRecent['District'] || 'N/A'
                                    }, sessions: uniqueSessions, allSessions: uniqueSessions
                                });
                                setFilters({ level: '', district: '', mode: '', category: '' });
                            }
                        }
                    } catch (e) { /* ignore parse errors */ }
                }
            }, [loading, data]);

            // Build indexes for fast lookup
            const indexes = useMemo(() => {
                const idIndex = {};
                const persalIndex = {};
                data.forEach(record => {
                    const id = record['ID/Passport Number']?.trim();
                    const persal = record['PERSAL Number']?.trim();
                    if (id) {
                        if (!idIndex[id]) idIndex[id] = [];
                        idIndex[id].push(record);
                    }
                    if (persal) {
                        if (!persalIndex[persal]) persalIndex[persal] = [];
                        persalIndex[persal].push(record);
                    }
                });
                return { idIndex, persalIndex };
            }, [data]);

            // Handle search
            const handleSearch = () => {
                if (!searchValue.trim() || !acknowledged) return;

                const searchKey = searchValue.trim();
                let records = [];

                if (searchType === 'id') {
                    records = indexes.idIndex[searchKey] || [];
                } else {
                    records = indexes.persalIndex[searchKey] || [];
                }

                if (records.length === 0) {
                    setResults({ profile: null, sessions: [], allSessions: [] });
                    return;
                }

                const sortedRecords = [...records].sort((a, b) => parseTimestamp(b.Timestamp) - parseTimestamp(a.Timestamp));
                const mostRecent = sortedRecords[0];
                const profile = {
                    name: `${mostRecent['First Name']} ${mostRecent['Surname']}`.trim(),
                    school: mostRecent['School'] || 'N/A',
                    district: mostRecent['District'] || 'N/A'
                };

                const seenSessions = new Set();
                const uniqueSessions = sortedRecords
                    .filter(record => {
                        const key = `${record['Session Name']}_${record.Timestamp}`;
                        if (seenSessions.has(key)) return false;
                        seenSessions.add(key);
                        return true;
                    })
                    .map(record => ({
                        ...record,
                        parsedDate: parseTimestamp(record.Timestamp),
                        year: parseTimestamp(record.Timestamp)?.getFullYear() || 'Unknown',
                        isSpark: isSpark(record['Session Name']),
                        isDovetail: isDovetail(record['Session Name'])
                    }));

                setResults({ profile, sessions: uniqueSessions, allSessions: uniqueSessions });
                setFilters({ level: '', district: '', mode: '', category: '' });

                localStorage.setItem('wced_pd_credentials', JSON.stringify({ searchType, searchValue: searchKey }));
            };

            // Apply filters
            const filteredSessions = useMemo(() => {
                if (!results) return [];
                let filtered = results.allSessions;

                if (filters.level) {
                    filtered = filtered.filter(s => s['Development Level']?.toLowerCase().trim() === filters.level.toLowerCase().trim());
                }
                if (filters.district) {
                    filtered = filtered.filter(s => s['Hosting District']?.trim() === filters.district);
                }
                if (filters.mode) {
                    filtered = filtered.filter(s => s['Delivery Mode']?.trim() === filters.mode);
                }
                if (filters.category === 'spark') {
                    filtered = filtered.filter(s => s.isSpark);
                }
                if (filters.category === 'dovetail') {
                    filtered = filtered.filter(s => s.isDovetail);
                }
                return filtered;
            }, [results, filters]);

            // Group by year
            const sessionsByYear = useMemo(() => {
                const grouped = {};
                filteredSessions.forEach(session => {
                    const year = session.year;
                    if (!grouped[year]) grouped[year] = [];
                    grouped[year].push(session);
                });
                return Object.keys(grouped)
                    .sort((a, b) => b - a)
                    .map(year => ({ year, sessions: grouped[year] }));
            }, [filteredSessions]);

            // Calculate metrics
            const metrics = useMemo(() => {
                if (!results) return null;
                const total = filteredSessions.length;
                const byLevel = {
                    'Laying the Foundation': 0,
                    'I can do it': 0,
                    'I can do it better': 0,
                    'The Summit': 0,
                    'Other': 0
                };

                filteredSessions.forEach(session => {
                    const level = session['Development Level']?.trim();
                    if (byLevel.hasOwnProperty(level)) {
                        byLevel[level]++;
                    } else {
                        byLevel['Other']++;
                    }
                });

                const uniqueSparkSessions = [...new Set(results.allSessions.filter(s => s.isSpark).map(s => s['Session Name']?.trim()))];
                const uniqueDovetailSessions = [...new Set(results.allSessions.filter(s => s.isDovetail).map(s => s['Session Name']?.trim()))];
                const bonusSpark = uniqueDovetailSessions.length >= 5 ? 1 : 0;
                const totalSparks = uniqueSparkSessions.length + bonusSpark;

                return {
                    total,
                    byLevel,
                    uniqueSparks: uniqueSparkSessions,
                    uniqueDovetails: uniqueDovetailSessions,
                    totalSparks,
                    totalDovetails: uniqueDovetailSessions.length,
                    hasBonusSpark: bonusSpark === 1
                };
            }, [filteredSessions, results]);

            // Get unique filter values
            const filterOptions = useMemo(() => {
                if (!results) return { levels: [], districts: [], modes: [] };
                const levels = [...new Set(results.allSessions.map(s => s['Development Level']?.trim()).filter(Boolean))];
                const districts = [...new Set(results.allSessions.map(s => s['Hosting District']?.trim()).filter(Boolean))].sort();
                const modes = [...new Set(results.allSessions.map(s => s['Delivery Mode']?.trim()).filter(Boolean))].sort();
                return { levels, districts, modes };
            }, [results]);

            // Export to CSV
            const exportToCSV = () => {
                const csvData = filteredSessions.map(session => ({
                    'Date': formatDate(session.parsedDate),
                    'Session Name': session['Session Name'] || '',
                    'Development Level': session['Development Level'] || '',
                    'Hosting District': session['Hosting District'] || '',
                    'Delivery Mode': session['Delivery Mode'] || '',
                    'Facilitator': session['Facilitator'] || '',
                    'Is Spark': session.isSpark ? 'Yes' : 'No',
                    'Is Dovetail': session.isDovetail ? 'Yes' : 'No'
                }));
                const csv = Papa.unparse(csvData);
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'my_pd_history.csv';
                link.click();
            };

            const isValidInput = () => {
                if (!searchValue.trim()) return false;
                if (searchType === 'id') return /^\d{13}$/.test(searchValue.trim());
                if (searchType === 'persal') return /^\d{8}$/.test(searchValue.trim());
                return false;
            };

            const canSearch = acknowledged && isValidInput();

            if (loading) {
                return e('div', { className: "min-h-screen flex items-center justify-center" },
                    e('div', { className: "text-center" },
                        e('div', { className: "animate-spin rounded-full h-12 w-12 border-b-2 border-wcg-blue mx-auto mb-4" }),
                        e('p', { className: "text-gray-600" }, "Loading attendance records...")
                    )
                );
            }

            return e('div', { className: "min-h-screen bg-gray-50" },
                e('header', { className: "bg-white shadow-sm no-print relative" },
                    e('div', { className: "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center" },
                        e('img', { src: "header.png", alt: "WCED Header", className: "h-12 sm:h-16" }),
                        e('div', { className: "relative" },
                            e('button', {
                                onClick: () => setMenuOpen(!menuOpen),
                                className: "flex items-center justify-center w-10 h-10 rounded-lg border-2 border-gray-300 hover:border-wcg-blue hover:bg-gray-50 transition-colors"
                            },
                                menuOpen 
                                    ? e('svg', { className: "w-5 h-5 text-gray-700", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M6 18L18 6M6 6l12 12" }))
                                    : e('svg', { className: "w-5 h-5 text-gray-700", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M4 6h16M4 12h16M4 18h16" }))
                            ),
                            menuOpen && e('div', { className: "absolute right-0 top-12 bg-white rounded-xl shadow-lg border border-gray-200 py-2 w-52 z-50" },
                                e('a', { href: "my-journey.html", className: "block px-4 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-50 hover:text-wcg-blue transition-colors" }, "My PD Journey"),
                                e('a', { href: "pathway.html", className: "block px-4 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-50 hover:text-wcg-blue transition-colors" }, "Pathway Overview"),
                                e('a', { href: "index.html", className: "block px-4 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-50 hover:text-wcg-blue transition-colors" }, "Upcoming Sessions"),
                                e('a', { href: "calendar.html", className: "block px-4 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-50 hover:text-wcg-blue transition-colors" }, "Calendar")
                            )
                        )
                    )
                ),
                e('div', { className: "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 print-full-width" },
                    !results ? e('div', { className: "max-w-2xl mx-auto no-print" },
                        e('div', { className: "bg-white rounded-lg shadow-md p-8" },
                            e('h1', { className: "text-3xl font-bold text-wcg-dark mb-6 text-center" }, "My PD History"),
                            e('p', { className: "text-gray-600 mb-8 text-center" }, "View your complete professional development attendance record"),
                            e('div', { className: "mb-6" },
                                e('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, "Search by:"),
                                e('div', { className: "flex gap-4" },
                                    e('button', {
                                        onClick: () => { setSearchType('id'); setSearchValue(''); },
                                        className: `flex-1 py-3 px-4 rounded-lg border-2 transition-colors ${searchType === 'id' ? 'border-wcg-blue bg-wcg-blue text-white' : 'border-gray-300 bg-white text-gray-700 hover:border-wcg-blue'}`
                                    }, "ID Number"),
                                    e('button', {
                                        onClick: () => { setSearchType('persal'); setSearchValue(''); },
                                        className: `flex-1 py-3 px-4 rounded-lg border-2 transition-colors ${searchType === 'persal' ? 'border-wcg-blue bg-wcg-blue text-white' : 'border-gray-300 bg-white text-gray-700 hover:border-wcg-blue'}`
                                    }, "PERSAL Number")
                                )
                            ),
                            e('div', { className: "mb-6" },
                                e('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, searchType === 'id' ? 'ID Number (13 digits)' : 'PERSAL Number (8 digits)'),
                                e('input', {
                                    type: "text",
                                    value: searchValue,
                                    onChange: (e) => setSearchValue(e.target.value),
                                    onKeyPress: (e) => e.key === 'Enter' && canSearch && handleSearch(),
                                    placeholder: searchType === 'id' ? '1234567890123' : '12345678',
                                    className: "w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-wcg-blue focus:border-transparent",
                                    maxLength: searchType === 'id' ? 13 : 8
                                }),
                                searchValue && !isValidInput() && e('p', { className: "text-sm text-red-600 mt-1" }, `Please enter a valid ${searchType === 'id' ? '13-digit ID' : '8-digit PERSAL'} number`)
                            ),
                            e('div', { className: "mb-6" },
                                e('label', { className: "flex items-start gap-3 cursor-pointer" },
                                    e('input', {
                                        type: "checkbox",
                                        checked: acknowledged,
                                        onChange: (e) => setAcknowledged(e.target.checked),
                                        className: "mt-1 h-5 w-5 text-wcg-blue border-gray-300 rounded focus:ring-wcg-blue"
                                    }),
                                    e('span', { className: "text-sm text-gray-700" }, "I confirm I am accessing my own professional development records for personal verification purposes only.")
                                )
                            ),
                            e('div', { className: "mb-6 bg-yellow-50 border border-yellow-200 rounded-lg p-3 text-xs text-yellow-800" },
                                e('strong', null, "DISCLAIMER:"),
                                " This record is generated from self-captured attendance data. Every effort is made to ensure accuracy; discrepancies may occur due to manual entry errors. Please ensure consistency in your submissions to maintain an accurate transformation profile.",
                                e('br'),
                                e('strong', null, "Data last updated: "),
                                DATA_LAST_UPDATED
                            ),
                            e('button', {
                                onClick: handleSearch,
                                disabled: !canSearch,
                                className: `w-full py-3 px-4 rounded-lg font-semibold transition-colors ${canSearch ? 'bg-wcg-blue text-white hover:bg-blue-700' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`
                            }, "View My History")
                        )
                    ) : e('div', null,
                        results.profile ? e(React.Fragment, null,
                            e(ChecklistModal, {
                                isOpen: modalOpen.isOpen,
                                onClose: () => setModalOpen({ isOpen: false, type: null }),
                                type: modalOpen.type,
                                completedSessions: modalOpen.type === 'spark' ? metrics.uniqueSparks : metrics.uniqueDovetails,
                                allSessions: results.allSessions
                            }),
                            e('div', { className: "bg-white rounded-lg shadow-md p-6 mb-6 no-print" },
                                e('div', { className: "flex justify-between items-start" },
                                    e('div', null,
                                        e('h2', { className: "text-2xl font-bold text-wcg-dark mb-2" }, results.profile.name),
