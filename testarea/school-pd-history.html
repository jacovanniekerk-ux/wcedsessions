<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School PD Report - WCED Professional Development</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ============================================================
        // SUPABASE CONFIG — replace with your own project URL and key
        // ============================================================
        const SUPABASE_URL = 'https://cftpufjzwpmhgzdcgpjb.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_b1H_5DJYLQSrr83T_dvz6A_2UAqOVg4';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        const ATTENDANCE_TABLE = 'attendance';
        const SCHOOLS_TABLE = 'schools';

        // Same attendance columns as the individual PD history page
        const COLUMN_MAP = {
            'Timestamp': 'Timestamp',
            'First Name': 'First Name',
            'Surname': 'Surname',
            'School': 'School',
            'District': 'District',
            'ID/Passport Number': 'ID/Passport Number',
            'PERSAL Number': 'PERSAL Number',
            'Session Name': 'Session Name',
            'Development Level': 'Development Level',
            'Facilitator': 'Facilitator',
            'Delivery Mode': 'Delivery Mode',
            'Hosting District': 'Hosting District'
        };

        // Maps to the columns in the `schools` table
        const SCHOOL_COLUMN_MAP = {
            'DataID': 'DataID',
            'SchoolName': 'School_Name'
        };

        function mapRowToRecord(row) {
            const record = {};
            Object.keys(COLUMN_MAP).forEach(appKey => {
                record[appKey] = row[COLUMN_MAP[appKey]] != null ? String(row[COLUMN_MAP[appKey]]) : '';
            });
            return record;
        }

        // Looks up a school's name from its DataID via the `schools` table.
        // Returns null if no matching school is found.
        async function resolveSchoolName(dataId) {
            const { data: rows, error } = await supabaseClient
                .from(SCHOOLS_TABLE)
                .select('*')
                .eq(SCHOOL_COLUMN_MAP.DataID, dataId)
                .limit(1);
            if (error) throw error;
            if (rows && rows.length > 0) {
                return rows[0][SCHOOL_COLUMN_MAP.SchoolName] || null;
            }
            return null;
        }

        // Fetches only the attendance rows belonging to a given school
        async function fetchAttendanceForSchool(schoolName) {
            const { data: rows, error } = await supabaseClient
                .from(ATTENDANCE_TABLE)
                .select('*')
                .eq(COLUMN_MAP['School'], schoolName);
            if (error) throw error;
            return (rows || []).map(mapRowToRecord);
        }

        // *** UPDATE THIS DATE WHEN YOU UPDATE THE CSV FILE ***
        const DATA_LAST_UPDATED = '2026-06-05'; // Format: YYYY-MM-DD
        // *****************************************************

        // Sparks and Dovetail definitions
        const SPARK_SESSIONS = [
            'Adoption Strategy',
            'Digital Skills Course',
            'Facilitator Think Tank',
            'Cyber Effect Ambassador Initiation Course'
        ];

        const DOVETAIL_SESSIONS = [
            'ePedagogy: Building a Digital Lesson',
            'Integrating digital resources from the ePortal',
            'Google Fundamentals 1: Account and Google Chrome',
            'Office Online Fundamentals',
            'Improved Presentation Skills',
            'Ease of Access with QR Codes and Bit.ly links',
            'Teaching with Videos',
            'Orientation to Google Forms',
            'AI In Education: Work Smarter, not Harder',
            'Introduction to Cyber Wellness Education'
        ];

        // Utility functions
        function parseTimestamp(timestamp) {
            if (!timestamp) return null;
            try {
                const [datePart] = timestamp.split(' ');
                const [day, month, year] = datePart.split('/');
                return new Date(year, month - 1, day);
            } catch {
                return null;
            }
        }

        function formatDate(dateObj) {
            if (!dateObj) return 'N/A';
            const day = String(dateObj.getDate()).padStart(2, '0');
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const year = dateObj.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function getQuarter(date) {
            if (!date) return null;
            const month = date.getMonth();
            return Math.floor(month / 3) + 1;
        }

        function getLevelColor(level) {
            if (!level) return 'bg-gray-200 text-gray-800';
            const normalized = level.toLowerCase().trim();
            if (normalized === 'laying the foundation') return 'bg-wcg-green text-white';
            if (normalized === 'i can do it') return 'bg-wcg-yellow text-black';
            if (normalized === 'i can do it better') return 'bg-wcg-red text-white';
            if (normalized === 'the summit') return 'bg-wcg-blue text-white';
            return 'bg-gray-200 text-gray-800';
        }

        function isSpark(sessionName) {
            return SPARK_SESSIONS.includes(sessionName?.trim());
        }

        function isDovetail(sessionName) {
            return DOVETAIL_SESSIONS.includes(sessionName?.trim());
        }

        function getModeIcon(mode) {
            if (!mode) return '📋';
            const normalized = mode.trim().toLowerCase();
            if (normalized === 'virtual') return '🖥️';
            if (normalized === 'face-to-face') return '🏢';
            if (normalized === 'hybrid') return '🔄';
            if (normalized === 'self-paced') return '📚';
            return '📋';
        }

        function getURLParameter(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function App() {
            const [loading, setLoading] = useState(true);
            const [schoolName, setSchoolName] = useState('');
            const [schoolData, setSchoolData] = useState([]);
            const [filters, setFilters] = useState({
                years: [],
                level: '',
                mode: '',
                sessionLevel: '',
                showSparks: false,
                showDovetails: false
            });
            const [expandedTeachers, setExpandedTeachers] = useState(new Set());
            const [teacherSort, setTeacherSort] = useState('name');
            const [viewMode, setViewMode] = useState('teachers');
            const [selectedSession, setSelectedSession] = useState(null);

            // DataID security state
            const [dataIdInput, setDataIdInput] = useState('');
            const [lookupError, setLookupError] = useState('');
            const [checkingId, setCheckingId] = useState(false);

            const quarterChartRef = useRef(null);
            const pieChartRef = useRef(null);
            const quarterChartInstance = useRef(null);
            const pieChartInstance = useRef(null);

            // Resolve DataID from the URL on mount (Supabase lookup, not the whole CSV)
            useEffect(() => {
                (async () => {
                    const dataId = getURLParameter('school');
                    if (!dataId) {
                        setLoading(false);
                        return;
                    }
                    try {
                        const resolved = await resolveSchoolName(dataId);
                        if (resolved) {
                            setSchoolName(resolved);
                            setLookupError('');
                            // loading stays true; the attendance-fetch effect below clears it
                        } else {
                            setLookupError('invalid');
                            setLoading(false);
                        }
                    } catch (err) {
                        console.error('Error resolving school ID:', err);
                        setLookupError('invalid');
                        setLoading(false);
                    }
                })();
            }, []);

            // Fetch attendance rows for the resolved school (only that school's rows are ever sent to the browser)
            useEffect(() => {
                if (!schoolName) return;
                (async () => {
                    try {
                        const rows = await fetchAttendanceForSchool(schoolName);
                        const filtered = rows
                            .map(record => ({
                                ...record,
                                parsedDate: parseTimestamp(record.Timestamp),
                                year: parseTimestamp(record.Timestamp)?.getFullYear(),
                                quarter: getQuarter(parseTimestamp(record.Timestamp)),
                                isSpark: isSpark(record['Session Name']),
                                isDovetail: isDovetail(record['Session Name'])
                            }))
                            .filter(record => record.parsedDate); // Only valid dates

                        // Auto-select only current and previous year
                        const currentYear = new Date().getFullYear();
                        const previousYear = currentYear - 1;
                        const years = [...new Set(filtered.map(r => r.year))].sort();
                        const defaultYears = years.filter(y => y === currentYear || y === previousYear);

                        ReactDOM.unstable_batchedUpdates(() => {
                            setSchoolData(filtered);
                            setFilters(prev => ({ ...prev, years: defaultYears }));
                            setLoading(false);
                        });
                    } catch (err) {
                        console.error('Error loading attendance for school:', err);
                        ReactDOM.unstable_batchedUpdates(() => {
                            setSchoolData([]);
                            setLoading(false);
                        });
                    }
                })();
            }, [schoolName]);

            // Get available years for checkboxes
            const availableYears = useMemo(() => {
                return [...new Set(schoolData.map(r => r.year))].sort();
            }, [schoolData]);

            // Apply filters
            const filteredData = useMemo(() => {
                let filtered = schoolData;

                if (filters.years.length > 0) {
                    filtered = filtered.filter(r => filters.years.includes(r.year));
                }

                if (filters.level) {
                    filtered = filtered.filter(r =>
                        r['Development Level']?.toLowerCase().trim() === filters.level.toLowerCase().trim()
                    );
                }

                if (filters.mode) {
                    filtered = filtered.filter(r => r['Delivery Mode']?.trim() === filters.mode);
                }

                // Apply Spark/Dovetail toggles
                if (filters.showSparks && !filters.showDovetails) {
                    filtered = filtered.filter(r => r.isSpark);
                } else if (filters.showDovetails && !filters.showSparks) {
                    filtered = filtered.filter(r => r.isDovetail);
                } else if (filters.showSparks && filters.showDovetails) {
                    filtered = filtered.filter(r => r.isSpark || r.isDovetail);
                }

                return filtered;
            }, [schoolData, filters]);

            // Scorecard Metrics
            const scorecardMetrics = useMemo(() => {
                const uniqueTeachersCount = new Set(filteredData.map(r => `${r['First Name']} ${r['Surname']}`)).size;
                const totalWorkshopsAttended = filteredData.length;
                return { uniqueTeachersCount, totalWorkshopsAttended };
            }, [filteredData]);

            // Prepare Data for the Print Table
            const printTableData = useMemo(() => {
                return [...filteredData].sort((a, b) => {
                    const nameA = a['First Name']?.trim().toLowerCase() || '';
                    const nameB = b['First Name']?.trim().toLowerCase() || '';
                    if (nameA < nameB) return -1;
                    if (nameA > nameB) return 1;

                    const surnameA = a['Surname']?.trim().toLowerCase() || '';
                    const surnameB = b['Surname']?.trim().toLowerCase() || '';
                    if (surnameA < surnameB) return -1;
                    if (surnameA > surnameB) return 1;

                    return a.parsedDate - b.parsedDate;
                });
            }, [filteredData]);

            // Get filter options
            const filterOptions = useMemo(() => {
                const levels = [...new Set(schoolData.map(r => r['Development Level']?.trim()).filter(Boolean))];
                const modes = [...new Set(schoolData.map(r => r['Delivery Mode']?.trim()).filter(Boolean))].sort();
                return { levels, modes };
            }, [schoolData]);

            // Calculate quarterly data
            const quarterlyData = useMemo(() => {
                const quarters = {};

                filteredData.forEach(record => {
                    const key = `${record.year}-Q${record.quarter}`;
                    if (!quarters[key]) {
                        quarters[key] = {
                            label: key,
                            uniqueTeachers: new Set(),
                            totalAttendances: 0
                        };
                    }
                    quarters[key].uniqueTeachers.add(`${record['First Name']} ${record['Surname']}`);
                    quarters[key].totalAttendances++;
                });

                return Object.keys(quarters)
                    .sort()
                    .map(key => ({
                        label: key,
                        uniqueTeachers: quarters[key].uniqueTeachers.size,
                        totalAttendances: quarters[key].totalAttendances
                    }));
            }, [filteredData]);

            // Calculate level distribution
            const levelDistribution = useMemo(() => {
                const levels = {
                    'Laying the Foundation': 0,
                    'I can do it': 0,
                    'I can do it better': 0,
                    'The Summit': 0
                };

                filteredData.forEach(record => {
                    const level = record['Development Level']?.trim();
                    if (levels.hasOwnProperty(level)) {
                        levels[level]++;
                    }
                });

                return levels;
            }, [filteredData]);

            // Group by teachers
            const teacherData = useMemo(() => {
                const teachers = {};

                filteredData.forEach(record => {
                    const name = `${record['First Name']} ${record['Surname']}`.toUpperCase().trim();
                    if (!teachers[name]) {
                        teachers[name] = {
                            name,
                            sessions: [],
                            levelCounts: {
                                'Laying the Foundation': 0,
                                'I can do it': 0,
                                'I can do it better': 0,
                                'The Summit': 0
                            },
                            uniqueSparks: new Set(),
                            uniqueDovetails: new Set()
                        };
                    }

                    teachers[name].sessions.push(record);
                    const level = record['Development Level']?.trim();
                    if (teachers[name].levelCounts.hasOwnProperty(level)) {
                        teachers[name].levelCounts[level]++;
                    }

                    if (record.isSpark) {
                        teachers[name].uniqueSparks.add(record['Session Name']);
                    }
                    if (record.isDovetail) {
                        teachers[name].uniqueDovetails.add(record['Session Name']);
                    }
                });

                const teacherList = Object.values(teachers)
                    .map(t => ({
                        ...t,
                        totalSessions: t.sessions.length,
                        sparkCount: t.uniqueSparks.size + (t.uniqueDovetails.size >= 5 ? 1 : 0),
                        dovetailCount: t.uniqueDovetails.size
                    }));

                // Apply sorting
                if (teacherSort === 'name') {
                    teacherList.sort((a, b) => a.name.localeCompare(b.name));
                } else if (teacherSort === 'attendance') {
                    teacherList.sort((a, b) => b.totalSessions - a.totalSessions);
                } else if (teacherSort === 'sparks') {
                    teacherList.sort((a, b) => b.sparkCount - a.sparkCount);
                } else if (teacherSort === 'dovetails') {
                    teacherList.sort((a, b) => b.dovetailCount - a.dovetailCount);
                }

                return teacherList;
            }, [filteredData, teacherSort]);

            // Group by sessions
            const sessionData = useMemo(() => {
                const sessions = {};

                filteredData.forEach(record => {
                    const sessionName = record['Session Name']?.trim();
                    if (!sessionName) return;

                    if (!sessions[sessionName]) {
                        sessions[sessionName] = {
                            name: sessionName,
                            teacherAttendances: {},
                            level: record['Development Level'],
                            mode: record['Delivery Mode'],
                            isSpark: isSpark(sessionName),
                            isDovetail: isDovetail(sessionName)
                        };
                    }

                    const teacherName = `${record['First Name']} ${record['Surname']}`.toUpperCase().trim();

                    // Track all attendances per teacher
                    if (!sessions[sessionName].teacherAttendances[teacherName]) {
                        sessions[sessionName].teacherAttendances[teacherName] = [];
                    }

                    sessions[sessionName].teacherAttendances[teacherName].push({
                        date: record.parsedDate,
                        hostingDistrict: record['Hosting District'],
                        mode: record['Delivery Mode']
                    });
                });

                let sessionList = Object.values(sessions)
                    .map(s => {
                        // Create attendance list with unique teachers (alphabetically sorted)
                        const attendanceList = Object.keys(s.teacherAttendances)
                            .sort() // Alphabetical sort
                            .map(teacherName => {
                                // Sort dates for this teacher (most recent first)
                                const sortedDates = s.teacherAttendances[teacherName].sort((a, b) => b.date - a.date);
                                return {
                                    teacher: teacherName,
                                    attendances: sortedDates,
                                    mostRecentDate: sortedDates[0].date
                                };
                            });

                        // Count total attendances (all records)
                        const totalAttendances = Object.values(s.teacherAttendances).reduce((sum, arr) => sum + arr.length, 0);

                        return {
                            ...s,
                            attendanceList: attendanceList,
                            totalAttendances: totalAttendances,
                            uniqueTeachers: Object.keys(s.teacherAttendances).length
                        };
                    });

                // Apply session-level development level filter
                if (filters.sessionLevel) {
                    sessionList = sessionList.filter(s =>
                        s.level?.toLowerCase().trim() === filters.sessionLevel.toLowerCase().trim()
                    );
                }

                return sessionList.sort((a, b) => a.name.localeCompare(b.name));
            }, [filteredData, filters.sessionLevel]);
            useEffect(() => {

    if (sessionData.length === 0) {
        setSelectedSession(null);
        return;
    }

    if (
        !selectedSession ||
        !sessionData.some(s => s.name === selectedSession.name)
    ) {
        setSelectedSession(sessionData[0]);
    }

}, [sessionData]);
            // Render quarterly bar chart
useEffect(() => {
    if (!quarterChartRef.current || quarterlyData.length === 0) return;

    if (quarterChartInstance.current) {
        quarterChartInstance.current.destroy();
    }

    const ctx = quarterChartRef.current.getContext('2d');
    quarterChartInstance.current = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: quarterlyData.map(d => d.label),
            datasets: [
                {
                    label: 'Unique Teachers',
                    data: quarterlyData.map(d => d.uniqueTeachers),
                    backgroundColor: '#001489',
                    borderColor: '#001489', // Added missing comma here
                    borderWidth: 1
                },
                {
                    label: 'Total Attendances',
                    data: quarterlyData.map(d => d.totalAttendances),
                    backgroundColor: '#8FAD15', // WCG Green
                    borderColor: '#8FAD15',
                    borderWidth: 1
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { precision: 0 }
                }
            },
            plugins: {
                legend: {
                    display: true,
                    position: 'top'
                }
            }
        }
    });

    return () => {
        if (quarterChartInstance.current) {
            quarterChartInstance.current.destroy();
        }
    };
}, [quarterlyData]);

// Render pie chart
useEffect(() => {
    if (!pieChartRef.current || Object.values(levelDistribution).every(v => v === 0)) return;

    if (pieChartInstance.current) {
        pieChartInstance.current.destroy();
    }

    const ctx = pieChartRef.current.getContext('2d');
    pieChartInstance.current = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['Laying the Foundation', 'I can do it', 'I can do it better', 'The Summit'],
            datasets: [{
                data: [
                    levelDistribution['Laying the Foundation'],
                    levelDistribution['I can do it'],
                    levelDistribution['I can do it better'],
                    levelDistribution['The Summit']
                ],
                backgroundColor: [
                    '#8FAD15', // Updated to WCG Green
                    '#FDB913',
                    '#E30613',
                    '#001489'  // WCG Blue
                ]
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: true,
                    position: 'right'
                }
            }
        },
        // Custom plugin to render numerical session counts directly on slices
        plugins: [{
            id: 'pieSliceNumbers',
            afterDraw(chart) {
                const { ctx } = chart;
                chart.data.datasets.forEach((dataset, datasetIndex) => {
                    const meta = chart.getDatasetMeta(datasetIndex);
                    meta.data.forEach((element, index) => {
                        const value = dataset.data[index];
                        if (value && value > 0) {
                            const { x, y } = element.tooltipPosition();
                            ctx.save();
                            ctx.fillStyle = '#FFFFFF';
                            ctx.font = 'bold 13px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(value, x, y);
                            ctx.restore();
                        }
                    });
                });
            }
        }]
    });

    return () => {
        if (pieChartInstance.current) {
            pieChartInstance.current.destroy();
        }
    };
}, [levelDistribution]);

            // Toggle handlers
            const toggleTeacher = (name) => {
                setExpandedTeachers(prev => {
                    const next = new Set(prev);
                    if (next.has(name)) {
                        next.delete(name);
                    } else {
                        next.add(name);
                    }
                    return next;
                });
            };

            const toggleYear = (year) => {
                setFilters(prev => ({
                    ...prev,
                    years: prev.years.includes(year)
                        ? prev.years.filter(y => y !== year)
                        : [...prev.years, year].sort()
                }));
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-wcg-blue mx-auto mb-4"></div>
                            <p className="text-gray-600">Loading attendance records...</p>
                        </div>
                    </div>
                );
            }

            // Show invalid DataID error
            if (lookupError === 'invalid') {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="max-w-md mx-auto px-4">
                            <div className="bg-white rounded-lg shadow-md p-8 text-center">
                                <div className="text-red-500 mb-4">
                                    <svg className="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                    </svg>
                                </div>
                                <h3 className="text-xl font-semibold text-gray-900 mb-2">Invalid School ID</h3>
                                <p className="text-gray-600 mb-4">
                                    The school ID provided is not recognised. Please check the link you were given and try again.
                                </p>
                                <button
                                    onClick={() => { setLookupError(''); setCheckingId(false); window.history.replaceState({}, '', window.location.pathname); }}
                                    className="px-6 py-2 bg-wcg-blue text-white rounded-lg hover:opacity-90 transition-colors font-medium"
                                >
                                    Enter School ID Manually
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (!schoolName) {
                const handleDataIdSubmit = async (e) => {
                    e.preventDefault();
                    const trimmed = dataIdInput.trim();
                    if (!trimmed || checkingId) return;
                    setCheckingId(true);
                    try {
                        const resolved = await resolveSchoolName(trimmed);
                        if (resolved) {
                            window.location.href = `${window.location.pathname}?school=${encodeURIComponent(trimmed)}`;
                        } else {
                            setLookupError('invalid');
                            setCheckingId(false);
                        }
                    } catch (err) {
                        console.error('Error resolving school ID:', err);
                        setLookupError('invalid');
                        setCheckingId(false);
                    }
                };

                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">

{viewMode === 'sessions' && (

</td>

                                </thead>
                                <tbody>
                                    {printTableData.map((row, idx) => {
                                        // Highlight Dovetail (yellow) and Spark (pink) based on instructions
                                        let rowColor = "";
                                        if (row.isDovetail) rowColor = "bg-pink-100";
                                        else if (row.isSpark) rowColor = "bg-yellow-100";

                                        return (
                                            <tr key={idx} className={rowColor}>
                                                <td className="border border-gray-400 px-2 py-1">{row['First Name']}</td>
                                                <td className="border border-gray-400 px-2 py-1">{row['Surname']}</td>
                                                <td className="border border-gray-400 px-2 py-1">{formatDate(row.parsedDate)}</td>
                                                <td className="border border-gray-400 px-2 py-1">{row['Session Name']}</td>
                                                <td className="border border-gray-400 px-2 py-1">{row['Delivery Mode']}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                            {/* Table Legend / Key */}
                            <div className="mt-3 text-xs text-gray-700 space-y-2">
                                <div className="flex items-center gap-2">
                                    <span className="inline-block w-4 h-4 bg-pink-100 border border-gray-400 rounded"></span>
                                    <span>
                                        Highlighted sessions are <strong>Dovetail Essentials</strong> sessions.{" "}
                                            <a href="https://jacovanniekerk-ux.github.io/wcedsessions/dovetail-essentials.html" target="_blank" rel="noopener noreferrer" className="text-blue-600 underline hover:text-blue-800">
                                            Find out More</a>
                                        </span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="inline-block w-4 h-4 bg-yellow-100 border border-gray-400 rounded"></span>
                                    <span>
                                        Highlighted sessions are sessions that award a <strong>Spark</strong>.{" "}
                                        <a href="https://jacovanniekerk-ux.github.io/wcedsessions/pathway.html" target="_blank" rel="noopener noreferrer" className="text-blue-600 underline hover:text-blue-800">
                                        Find out More</a>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>

</html>
