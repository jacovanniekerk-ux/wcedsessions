    <style>
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(253, 185, 19, 0.45); }
            50% { box-shadow: 0 0 0 10px rgba(253, 185, 19, 0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        html { scroll-behavior: smooth; }
        body { -webkit-tap-highlight-color: transparent; }

        .animate-fade-in-up { animation: fadeInUp 0.35s ease-out forwards; }
        .sheet-backdrop { animation: fadeIn 0.2s ease-out forwards; }
        .sheet-panel { animation: slideUp 0.28s cubic-bezier(0.32, 0.72, 0, 1) forwards; }

        .milestone-shimmer {

        .no-scrollbar { scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .snap-x-chip { scroll-snap-align: start; }

        @media print {

            body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-full-width { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }

<body class="bg-wcg-mist font-sans text-wcg-dark antialiased">
    <div id="root"></div>

    <script>
        const { useState, useEffect, useMemo, useRef } = React;
        const e = React.createElement;

        // ============================================================
        // SUPABASE CONFIG — replace with your own project URL and key
        // ============================================================
        const SUPABASE_URL = 'https://cftpufjzwpmhgzdcgpjb.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_b1H_5DJYLQSrr83T_dvz6A_2UAqOVg4';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        // Name of the table in Supabase that holds the attendance records
        const TABLE_NAME = 'attendance';

        // Maps the app's internal field names to the actual column names
        // in your Supabase table. Edit the right-hand values to match.
        const COLUMN_MAP = {
            'Timestamp': 'Timestamp',
            'First Name': 'First Name',
            'Surname': 'Surname',
            'School': 'School',
            'District': 'District',
            'ID/Passport Number': 'ID_number',
            'PERSAL Number': 'PERSAL Number',
            'Session Name': 'Session Name',
            'Development Level': 'Development Level',
            'Facilitator': 'Facilitator',
            'Delivery Mode': 'Delivery Mode',
            'Hosting District': 'Hosting District'
        };

        function mapRowToRecord(row) {
            const record = {};
            Object.keys(COLUMN_MAP).forEach(appKey => {
                record[appKey] = row[COLUMN_MAP[appKey]] != null ? String(row[COLUMN_MAP[appKey]]) : '';
            });
            return record;
        }

        // Queries Supabase for every record matching a given ID or PERSAL
        // number. Only matching rows are ever sent to the browser.
        async function fetchRecordsByKey(searchType, key) {
            const column = searchType === 'id' ? COLUMN_MAP['ID/Passport Number'] : COLUMN_MAP['PERSAL Number'];
            const { data: rows, error } = await supabaseClient
                .from(TABLE_NAME)
                .select('*')
                .eq(column, key);
            if (error) throw error;
            return (rows || []).map(mapRowToRecord);
        }

        // === DATA LAST UPDATED (manually update this when refreshing data) ===
        const DATA_LAST_UPDATED = '05 June 2026';

        // === SESSION DEFINITIONS ===
        const SPARK_SESSIONS = [
            'Adoption Strategy',
            'Digital Skills Course',
            'Facilitator Think Tank',
            'Cyber Effect Ambassador Initiation Course'
        ];

        const PATHWAY_SPARK_SESSIONS = [
            'Adoption Strategy',
            'Digital Skills Course',
            'Cyber Effect Ambassador Initiation Course'
        ];

        const DOVETAIL_SESSIONS = [
            'ePedagogy: Building a Digital Lesson',
            'Integrating digital resources from the ePortal',
            'Google Fundamentals 1: Account and Google Chrome',
            'Office Online Fundamentals',
            'Improved Presentation Skills',
            'Ease of Access with QR Codes and Bit.ly links',
            'Teaching with Videos',
            'Orientation to Google Forms',
            'AI In Education: Work Smarter, not Harder',
            'Introduction to Cyber Wellness Education'
        ];

        // Milestone definitions for the pathway — colors and enrichment
        // (keyPoints, dovetailEssentials, availability, next) sourced from pathway.html
        const MILESTONES = [
            {
                id: 'adoption', step: 1, title: 'ICT Adoption Strategy', subtitle: 'The Entry Point',
                icon: '🧭', color: '#00A1A3', lightColor: '#E5F6F6', sparkSession: 'Adoption Strategy',
                duration: '24-hour self-paced course',
                description: 'A foundational online course providing a broad perspective on the visibility of the digital landscape and the "Transformation Agenda." This journey moves you from digital novice to confident ICT integrator.',
                keyPoints: [
                    'Comprehensive 12-week self-paced online course',
                    'Explore the landscape of ICT integration in education',
                    'Understand the vision of the Transformation Agenda',
                    'Build foundational digital literacy and confidence',
                    'Earn your first Spark toward becoming a Transformation Agent'
                ],
                availability: {
                    type: 'registration',
                    registerUrl: 'http://bit.ly/4sgSf9g?r=lp&m=Mma39rNpG6w',
                    waitlistUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeT-sQEVUDnNQ652jxOLogI6DzXV6ZDv9wCPZSa8VXKjNOKFQ/viewform?usp=pp_url&entry.1581432046=ICT+Adoption+Strategy',
                    expiryDate: '2026-03-22',
                    activeMessage: 'Registrations are currently open!',
                    expiredMessage: 'Registrations for the current cohort have closed. Keep an eye on eTPD communications for the next intake, or join the waitlist below.'
                },
                next: 'Begin your transformation journey by exploring the digital landscape and understanding how technology can enhance teaching and learning.'
            },
            {
                id: 'dovetail', step: 2, title: 'Dovetail Essentials', subtitle: 'Customisation & Micro-Learning',
                icon: '🧰', color: '#8FAD15', lightColor: '#F2F6E3', sparkSession: null,
                duration: '10 focused micro-learning sessions',
                description: 'A non-linear pathway through targeted 60-120 minute sessions that build practical digital competency (the how). Choose the sessions that match your needs and context across multiple platforms and tools.',
                dovetailEssentials: [
                    'ePedagogy: Building a Digital Lesson',
                    'Integrating digital resources from the ePortal',
                    'Google Fundamentals 1: Account and Google Chrome',
                    'Office Online Fundamentals',
                    'Improved Presentation Skills',
                    'Ease of Access with QR Codes and Bit.ly links',
                    'Teaching with Videos',
                    'Orientation to Google Forms',
                    'AI In Education: Work Smarter, not Harder',
                    'Introduction to Cyber Wellness Education'
                ],
                sessionsInfoUrl: 'https://jacovanniekerk-ux.github.io/wcedsessions/dovetail-essentials.html',
                keyPoints: [
                    'Flexible, non-linear pathway—attend what you need',
                    'Short, practical sessions (60-120 minutes)',
                    'Four developmental levels: Laying the Foundation → I Can Do It → I Can Do It Better → The Summit',
                    'Build practical classroom-ready digital skills',
                    'Earn your second Spark toward becoming a Transformation Agent'
                ],
                next: 'Customize your learning journey by selecting sessions that address your specific needs and developmental level.'
            },
            {
                id: 'digitalskills', step: 3, title: 'Digital Skills Course', subtitle: 'The Experiential Shift',
                icon: '📖', color: '#007DBA', lightColor: '#E5F2F8', sparkSession: 'Digital Skills Course',
                duration: '4-week hybrid immersion',
                description: 'An experiential hybrid course that shifts your focus from "how to use" to "how to learn." View technology from the learner\'s perspective and develop digital wisdom (the why).',
                keyPoints: [
                    'Immersive 4-week hybrid learning experience',
                    'Shift from teacher-centered to learner-centered perspective',
                    'Synthesize the "what" and "how" into "when" and "why"',
                    'Develop digital wisdom through experiential learning',

                    'Earn your third Spark and become a School-Level Transformation Agent'
                ],
                availability: {
                    type: 'waitlist_only',
                    waitlistUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeT-sQEVUDnNQ652jxOLogI6DzXV6ZDv9wCPZSa8VXKjNOKFQ/viewform?usp=pp_url&entry.1581432046=Digital+Skills+Course',
                    message: 'These courses are hosted each term in the district and are by invitation only. Join the waitlist to express your interest to join a course when available.'
                },
                next: 'Experience transformation by seeing technology through your learners\' eyes and develop the wisdom to make informed pedagogical decisions.'
            },
            {
                id: 'cybereffect', step: 4, title: 'Cyber Effect Ambassador', subtitle: 'Ethical Capstone',
                icon: '🌐', color: '#C8126E', lightColor: '#FBE7F0', sparkSession: 'Cyber Effect Ambassador Initiation Course',
                duration: 'Self-paced 4-week course',
                description: 'Deepen your ability to engage with the ethical, emotional, psychological, and behavioural dimensions of technology use. Master the 4P Affective Transformation Model (People, Practices, Pedagogy, Platforms).',
                keyPoints: [
                    'Focus on digital citizenship and cyber wellness',
                    'Understand human-centered design principles',
                    'Master the 4P Model: People, Practices, Pedagogy, Platforms',
                    'Address emotional readiness and psychological safety',
                    'Promote reflective digital responsibility and ethical technology use',
                    'Earn your fourth Spark and become a Cluster-Level Transformation Agent'
                ],
                availability: {
                    type: 'registration',
                    registerUrl: 'YOUR_REGISTER_LINK_HERE',
                    waitlistUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeT-sQEVUDnNQ652jxOLogI6DzXV6ZDv9wCPZSa8VXKjNOKFQ/viewform?usp=pp_url&entry.1581432046=Cyber+Ambassador',
                    expiryDate: '2026-07-01',
                    activeMessage: 'Registrations are currently open!',
                    expiredMessage: 'Registrations have closed. Please join the waitlist to be notified of the next intake.'
                },
                next: 'Become a champion for ethical, human-centered technology integration and support your school community in building a positive digital culture.'
            }
        ];

        // Edvance ARC (Facilitator ARC) — specialised, by-invitation track.
        // Only "Facilitator Think Tank" earns a Spark; Elevate and Shift and
        // Spark deepen leadership but do not add to the core pathway Sparks.
        const EDVANCE_ARC = {
            icon: '🎓',
            title: 'Edvance ARC',
            subtitle: 'By Invitation',
            accentColor: '#672D82',
            lightColor: '#F3EBF7',
            steps: [
                { id: 'thinktank', name: 'Facilitator Think Tank', label: 'Step 1', spark: true },
                { id: 'elevate', name: 'Elevate', label: 'Step 2', spark: false },
                { id: 'shiftspark', name: 'Shift and Spark', label: 'Step 3', spark: false }
            ],
            description: 'The Edvance ARC is a dedicated face-to-face developmental pathway for educators ready to lead. Beginning at the Facilitator Think Tank (earning your Spark), this journey nurtures digital wisdom and leadership through immersive workshops. It equips you with the vision and practical tools needed to serve as a Transformation Agent, driving sustainable digital transformation across your school community.'
        };

        // === UTILITIES ===

        // Returns the appropriate call-to-action (register or waitlist link)
        // for a milestone's availability info, used by Next Steps suggestions.
        function getAvailabilityCTA(milestoneId) {
            const milestone = MILESTONES.find(m => m.id === milestoneId);
            if (!milestone || !milestone.availability) return null;
            const avail = milestone.availability;
            const now = new Date();
            now.setHours(0, 0, 0, 0);

            if (avail.type === 'registration') {
                const expiry = new Date(avail.expiryDate + 'T23:59:59');
                const isOpen = now <= expiry;
                return isOpen
                    ? { label: 'Register Now', url: avail.registerUrl, style: 'primary' }
                    : { label: 'Join Waitlist', url: avail.waitlistUrl, style: 'secondary' };
            }
            if (avail.type === 'waitlist_only') {
                return { label: 'Express Interest / Join Waitlist', url: avail.waitlistUrl, style: 'secondary' };
            }
            return null;
        }

        function parseTimestamp(timestamp) {
            if (!timestamp) return null;
            try {
                const [datePart] = timestamp.split(' ');
                const [day, month, year] = datePart.split('/');
                return new Date(year, month - 1, day);
            } catch {
                return null;
            }
        }

        function formatDate(dateObj) {
            if (!dateObj) return 'N/A';
            const day = String(dateObj.getDate()).padStart(2, '0');
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const year = dateObj.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function isSpark(sessionName) {
            return SPARK_SESSIONS.includes(sessionName && sessionName.trim());
        }

        function isDovetail(sessionName) {
            return DOVETAIL_SESSIONS.includes(sessionName && sessionName.trim());
        }

        function getLevelColor(level) {
            if (!level) return 'bg-gray-200 text-gray-800';
            const normalized = level.toLowerCase().trim();
            if (normalized === 'laying the foundation') return 'bg-wcg-green text-white';
            if (normalized === 'i can do it') return 'bg-wcg-yellow text-black';
            if (normalized === 'i can do it better') return 'bg-wcg-red text-white';
            if (normalized === 'the summit') return 'bg-wcg-blue text-white';
            return 'bg-gray-200 text-gray-800';
        }

        function getLevelDotColor(level) {
            if (!level) return 'bg-gray-300';
            const normalized = level.toLowerCase().trim();
            if (normalized === 'laying the foundation') return 'bg-wcg-green';
            if (normalized === 'i can do it') return 'bg-wcg-yellow';
            if (normalized === 'i can do it better') return 'bg-wcg-red';
            if (normalized === 'the summit') return 'bg-wcg-blue';
            return 'bg-gray-300';
        }

        function generateCertificateLink(participantName, sessionName, hostingDistrict, date) {
            const baseUrl = 'https://jacovanniekerk-ux.github.io/webapps/certificategenerator.html';
            const params = new URLSearchParams({
                name: participantName,
                session: sessionName,
                unit: hostingDistrict,
                date: formatDate(date)
            });
            return `${baseUrl}?${params.toString()}`;
        }

        const parseDate = (dateStr) => {
            if (!dateStr) return new Date(8640000000000000);
            const parts = dateStr.split('/');
            if (parts.length === 3) {
                const [day, month, year] = parts;
                return new Date(`${year}-${month}-${day}`);
            }
            return new Date(dateStr);
        };

        const isFutureOrToday = (dateObj) => {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            if (dateObj instanceof Date && !isNaN(dateObj)) {
                dateObj.setHours(0, 0, 0, 0);
                return dateObj >= today;
            }
            return false;
        };

        // Turn a set of matching Supabase records into the shape the rest
        // of the app expects (profile + deduplicated, sorted sessions).
        function buildResultsFromRecords(records) {
            if (records.length === 0) {
                return { profile: null, sessions: [], allSessions: [] };
            }
            const sortedRecords = [...records].sort((a, b) => parseTimestamp(b.Timestamp) - parseTimestamp(a.Timestamp));
            const mostRecent = sortedRecords[0];
            const profile = {
                name: `${mostRecent['First Name']} ${mostRecent['Surname']}`.trim(),
                school: mostRecent['School'] || 'N/A',
                district: mostRecent['District'] || 'N/A'
            };
            const seenSessions = new Set();
            const uniqueSessions = sortedRecords
                .filter(record => {
                    const key = `${record['Session Name']}_${record.Timestamp}`;
                    if (seenSessions.has(key)) return false;
                    seenSessions.add(key);
                    return true;
                })
                .map(record => {
                    const parsedDate = parseTimestamp(record.Timestamp);
                    return {
                        ...record,
                        parsedDate,
                        year: parsedDate ? parsedDate.getFullYear() : 'Unknown',
                        isSpark: isSpark(record['Session Name']),
                        isDovetail: isDovetail(record['Session Name'])
                    };
                });
            return { profile, sessions: uniqueSessions, allSessions: uniqueSessions };
        }

        // Quarter helpers for the attendance timeline
        const QUARTER_LABELS = { 1: 'Q1 (Jan – Mar)', 2: 'Q2 (Apr – Jun)', 3: 'Q3 (Jul – Sep)', 4: 'Q4 (Oct – Dec)' };
        function getQuarter(date) {
            if (!date) return null;
            return Math.floor(date.getMonth() / 3) + 1;
        }

        // ============================================================
        // SHARED UI PRIMITIVES
        // ============================================================

        // Sheet: bottom-sheet on mobile, centered modal on larger screens.
        function Sheet({ onClose, children, maxWidth = 'sm:max-w-2xl' }) {
            return e('div', {
                className: `fixed inset-0 z-50 flex items-end sm:items-center justify-center no-print sheet-backdrop modal-backdrop`,
                onClick: onClose
            },
                e('div', {
                    className: `sheet-panel bg-white w-full ${maxWidth} rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[90vh] overflow-y-auto relative`,
                    onClick: ev => ev.stopPropagation()
                },
                    e('div', { className: 'sm:hidden sticky top-0 flex justify-center pt-3 pb-1 bg-white z-10' },
                        e('span', { className: 'w-10 h-1.5 rounded-full bg-gray-300' })
                    ),
                    e('button', {
                        onClick: onClose,
                        'aria-label': 'Close',
                        className: 'absolute top-3 right-3 w-9 h-9 bg-gray-100 hover:bg-gray-200 rounded-full flex items-center justify-center font-bold text-gray-600 text-lg transition-all z-10'
                    }, '×'),
                    children
                )
            );
        }

        function CircularProgress({ percent, size, strokeWidth, color, trackColor, children }) {
            const safe = Math.min(100, Math.max(0, percent || 0));
            const radius = (size - strokeWidth) / 2;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (safe / 100) * circumference;
            return e('div', { className: 'relative inline-flex items-center justify-center flex-shrink-0', style: { width: size, height: size } },
                e('svg', { width: size, height: size, style: { transform: 'rotate(-90deg)' } },
                    e('circle', { cx: size / 2, cy: size / 2, r: radius, stroke: trackColor, strokeWidth, fill: 'none' }),
                    e('circle', {
                        cx: size / 2, cy: size / 2, r: radius, stroke: color, strokeWidth, fill: 'none',
                        strokeDasharray: circumference, strokeDashoffset: offset, strokeLinecap: 'round',
                        style: { transition: 'stroke-dashoffset 1.1s ease-out' }
                    })
                ),
                e('div', { className: 'absolute inset-0 flex items-center justify-center' }, children)
            );
        }

        function BottomNav({ tabs, activeTab, onSelect }) {
            return e('nav', { className: 'no-print fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur border-t border-gray-200 pb-safe' },
                e('div', { className: 'max-w-2xl mx-auto grid grid-cols-3' },
                    tabs.map(tab => {
                        const isActive = activeTab === tab.id;
                        return e('button', {
                            key: tab.id,
                            onClick: () => onSelect(tab.id),
                            className: `relative flex flex-col items-center justify-center gap-0.5 py-2.5 text-[11px] font-bold transition-colors ${isActive ? 'text-wcg-blue' : 'text-gray-400'}`
                        },
                            isActive ? e('span', { className: 'absolute top-0 h-0.5 w-9 rounded-full bg-wcg-blue' }) : null,
                            e('span', { className: 'relative text-xl leading-none mb-0.5' },
                                tab.icon,
                                tab.badge ? e('span', { className: 'absolute -top-1.5 -right-2.5 min-w-[16px] h-4 px-1 rounded-full bg-wcg-pink text-white text-[9px] font-bold flex items-center justify-center' }, tab.badge) : null
                            ),
                            e('span', null, tab.label)
                        );
                    })
                )
            );
        }

        // === NAV MENU ===
        function Menu() {
            const [isOpen, setIsOpen] = useState(false);

            const MenuIcon = () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "22", height: "22", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
                e('line', { x1: "4", x2: "20", y1: "12", y2: "12" }),
                e('line', { x1: "4", x2: "20", y1: "6", y2: "6" }),
                e('line', { x1: "4", x2: "20", y1: "18", y2: "18" })
            );

            const CloseIcon = () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "22", height: "22", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
                e('line', { x1: "18", x2: "6", y1: "6", y2: "18" }),
                e('line', { x1: "6", x2: "18", y1: "6", y2: "18" })
            );

            const linkStyle = "flex items-center gap-3 px-4 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-50 hover:text-wcg-blue border-b border-gray-100 last:border-b-0 transition-colors";

            return e('div', { className: "relative z-50" },
                e('button', {
                    onClick: () => setIsOpen(!isOpen),
                    className: "p-2 rounded-full text-gray-500 hover:bg-gray-100 hover:text-wcg-blue transition-colors focus:outline-none focus:ring-2 focus:ring-wcg-blue",
                    "aria-label": "Toggle menu"
                },
                    isOpen ? e(CloseIcon) : e(MenuIcon)
                ),
                isOpen ? e('div', { className: "fixed inset-0 z-40", onClick: () => setIsOpen(false) }) : null,
                isOpen ? e('div', { className: "absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.15)] border border-gray-100 overflow-hidden animate-fade-in-up z-50" },
                    e('div', { className: "py-1" },
                        e('a', { href: "index.html", className: linkStyle }, "🏠 Home"),

            const [results, setResults] = useState(null);
            const [upcomingData, setUpcomingData] = useState([]);
            const [activeTab, setActiveTab] = useState('pathway');
            const [selectedMilestone, setSelectedMilestone] = useState(null);
            const [selectedSession, setSelectedSession] = useState(null);
            const [modalOpen, setModalOpen] = useState({ isOpen: false, type: null });
            const [viewMode, setViewMode] = useState('timeline');
            const [filters, setFilters] = useState({ level: '', district: '', mode: '', category: '' });

            // Load the upcoming sessions CSV (used by the Next Steps tab)
            useEffect(() => {
                Papa.parse('upcoming-sessions.csv', {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: (result) => setUpcomingData(result.data),
                    error: () => setUpcomingData([])
                });
            }, []);

            // Swap the document title while printing so browsers that still show a
            // header/footer display something meaningful rather than the app name.
            useEffect(() => {
                if (!results || !results.profile) return;
                const originalTitle = document.title;
                const printTitle = `${results.profile.name} - PD Attendance Record`;
                const handleBeforePrint = () => { document.title = printTitle; };
                const handleAfterPrint = () => { document.title = originalTitle; };
                window.addEventListener('beforeprint', handleBeforePrint);
                window.addEventListener('afterprint', handleAfterPrint);
                return () => {
                    window.removeEventListener('beforeprint', handleBeforePrint);
                    window.removeEventListener('afterprint', handleAfterPrint);
                    document.title = originalTitle;
                };
            }, [results]);

            // Auto-login from localStorage
            useEffect(() => {
                (async () => {
                    try {
                        const saved = JSON.parse(localStorage.getItem('wced_pd_credentials') || 'null');
                        if (saved && saved.searchType && saved.searchValue) {
                            const searchKey = saved.searchValue.trim();
                            const records = await fetchRecordsByKey(saved.searchType, searchKey);
                            if (records.length > 0) {
                                setSearchType(saved.searchType);
                                setSearchValue(saved.searchValue);
                                setAcknowledged(true);
                                setResults(buildResultsFromRecords(records));
                                setFilters({ level: '', district: '', mode: '', category: '' });
                            }
                        }
                    } catch (err) {
                        console.error('Error during auto-login lookup:', err);
                    } finally {
                        setLoading(false);
                    }
                })();
            }, []);

            const handleSearch = async () => {
                if (!searchValue.trim() || !acknowledged || searching) return;
                const searchKey = searchValue.trim();
                setSearching(true);
                setSearchError('');
                try {
                    const records = await fetchRecordsByKey(searchType, searchKey);
                    setResults(buildResultsFromRecords(records));
                    setFilters({ level: '', district: '', mode: '', category: '' });
                    setActiveTab('pathway');
                    localStorage.setItem('wced_pd_credentials', JSON.stringify({ searchType, searchValue: searchKey }));
                } catch (err) {
                    console.error('Error fetching records from Supabase:', err);
                    setSearchError('Something went wrong looking up your records. Please try again.');
                } finally {
                    setSearching(false);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('wced_pd_credentials');
                setResults(null);
                setSearchValue('');
                setAcknowledged(false);
                setActiveTab('pathway');
            };

            // === PATHWAY STATUS (drives summary strip + Pathway tab) ===
            const pathwayStatus = useMemo(() => {
                if (!results || !results.sessions) return null;
                const sessions = results.sessions;
                const sessionNames = [...new Set(sessions.map(s => s['Session Name'] && s['Session Name'].trim()).filter(Boolean))];

                const hasAdoption = sessionNames.includes('Adoption Strategy');
                const hasDigitalSkills = sessionNames.includes('Digital Skills Course');
                const hasCyberEffect = sessionNames.includes('Cyber Effect Ambassador Initiation Course');
                const hasThinkTank = sessionNames.includes('Facilitator Think Tank');
                const hasElevate = sessionNames.includes('Elevate');
                const hasShiftSpark = sessionNames.includes('Shift and Spark');

                const completedDovetails = DOVETAIL_SESSIONS.filter(d => sessionNames.includes(d));
                const dovetailCount = completedDovetails.length;
                const remainingDovetails = DOVETAIL_SESSIONS.filter(d => !sessionNames.includes(d));
                const hasDovetailSpark = dovetailCount >= 5;

                const uniqueSparks = PATHWAY_SPARK_SESSIONS.filter(s => sessionNames.includes(s));
                const pathwaySparks = uniqueSparks.length + (hasDovetailSpark ? 1 : 0);
                const totalSparks = pathwaySparks + (hasThinkTank ? 1 : 0);

                const getCompletionDate = (sessionName) => {
                    const match = sessions.find(s => s['Session Name'] && s['Session Name'].trim() === sessionName);
                    return match ? formatDate(match.parsedDate) : null;
                };

                const milestoneStatuses = [
                    { state: hasAdoption ? 'completed' : 'not-started', detail: hasAdoption ? null : 'Enrols in cohorts twice a year', completedDate: getCompletionDate('Adoption Strategy') },
                    { state: dovetailCount >= 5 ? 'completed' : dovetailCount > 0 ? 'in-progress' : 'not-started', detail: dovetailCount > 0 ? `${dovetailCount}/10 sessions completed` : 'Flexible micro-learning sessions', progress: (dovetailCount / 10) * 100, completedDate: null },
                    { state: hasDigitalSkills ? 'completed' : 'not-started', detail: hasDigitalSkills ? null : hasAdoption ? 'By invitation after Adoption Strategy' : 'Complete Adoption Strategy first', completedDate: getCompletionDate('Digital Skills Course') },
                    { state: hasCyberEffect ? 'completed' : 'not-started', detail: hasCyberEffect ? null : 'By invitation', completedDate: getCompletionDate('Cyber Effect Ambassador Initiation Course') }
                ];

                const completedMilestones = milestoneStatuses.filter(m => m.state === 'completed').length;
                const overallProgress = (completedMilestones / 4) * 100;

                const byLevel = { 'Laying the Foundation': 0, 'I can do it': 0, 'I can do it better': 0, 'The Summit': 0 };
                sessions.forEach(s => {
                    const level = s['Development Level'] && s['Development Level'].trim();
                    if (byLevel.hasOwnProperty(level)) byLevel[level]++;
                });

                return {
                    milestoneStatuses, hasAdoption, hasDigitalSkills, hasCyberEffect, hasThinkTank, hasElevate, hasShiftSpark,
                    dovetailCount, completedDovetails, remainingDovetails, hasDovetailSpark,
                    pathwaySparks, totalSparks, overallProgress, totalSessions: sessions.length, byLevel
                };
            }, [results]);

            // === SUGGESTIONS (drives Next Steps tab) ===
            const suggestions = useMemo(() => {
                if (!pathwayStatus) return [];
                const { hasAdoption, hasDigitalSkills, hasCyberEffect, dovetailCount, remainingDovetails, totalSessions, hasDovetailSpark } = pathwayStatus;
                const items = [];

                if (!hasAdoption) {
                    items.push({
                        icon: '🧭', title: 'Start Your Journey: ICT Adoption Strategy',
                        description: 'This 12-week, self-paced online course is the starting line for any educator looking to reimagine their approach to technology. Whether you are validating what you already know, picking up new skills, or shifting your mindset, the course offers a broad perspective on the digital landscape and the vision of the Transformation Agenda.\n\nRegardless of your current tech skill level, this foundational step helps you confidently integrate ICT to transform your classroom. By completing the course, you will earn your first Spark—igniting your ongoing pathway as a Transformation Agent.',
                        type: 'action', ctas: [getAvailabilityCTA('adoption')].filter(Boolean)
                    });
                }

                if (dovetailCount < 10) {
                    const upcomingDovetailSessions = upcomingData
                        .filter(row => {
                            const name = row['Session Name'] && row['Session Name'].trim();
                            const matchesName = remainingDovetails.some(d => name && name.toLowerCase().includes(d.toLowerCase().split(':')[0].toLowerCase()));
                            if (!matchesName) return false;
                            const dateStr = row['Date'] && row['Date'].trim();
                            return isFutureOrToday(parseDate(dateStr));
                        })
                        .map(row => ({
                            date: (row['Date'] && row['Date'].trim()) || 'TBA',
                            name: row['Session Name'] && row['Session Name'].trim(),
                            district: (row['HOSTING DISTRICT'] && row['HOSTING DISTRICT'].trim()) || '',
                            time: row['Time'] || '',
                            venue: row['Venue'] || '',
                            link: row['Registration Link'] || row['Pre-Register'] || '',
                            description: row['Session Desciption'] || '',
                            level: row['Developmental Level'] || ''
                        }))
                        .sort((a, b) => parseDate(a.date) - parseDate(b.date))
                        .slice(0, 8);

                    const dovetailInfoCta = { label: 'View Session Details & Schedule', url: MILESTONES.find(m => m.id === 'dovetail').sessionsInfoUrl, style: 'secondary' };

                    if (dovetailCount === 0) {
                        items.push({
                            icon: '🧰', title: 'Build Practical Skills: Dovetail Essentials',
                            description: 'Choose from 10 focused micro-learning sessions (90-120 min each) to build practical digital skills. Complete 5 or more to earn a bonus Spark! Sessions run regularly across districts.',
                            type: 'action', sessions: upcomingDovetailSessions, ctas: [dovetailInfoCta]
                        });
                   } else if (!hasDovetailSpark) {
                        items.push({
                            icon: '🧰', title: `Keep Going: ${dovetailCount}/10 Dovetail Essentials Done`,
                            description: `You've completed ${dovetailCount} session${dovetailCount > 1 ? 's' : ''}. ${5 - dovetailCount > 0 ? `Complete ${5 - dovetailCount} more to earn your bonus Spark, or try these remaining sessions:` : 'Try these remaining sessions:'}`,
                            remainingList: remainingDovetails.slice(0, 3),
                            remainingMore: Math.max(0, remainingDovetails.length - 3),
                            type: 'progress', sessions: upcomingDovetailSessions, ctas: [dovetailInfoCta]
                        });
                    } else {
                        items.push({
                            icon: '🧰', title: `Dovetail Essentials Spark Earned! (${dovetailCount}/10 Complete)`,
                            description: `Great progress! You've earned your Dovetail Spark for completing at least half of the pathway. ${remainingDovetails.length > 0 ? 'Continue strengthening your skills with the remaining sessions:' : 'All 10 sessions complete!'}`,
                            remainingList: remainingDovetails.length > 0 ? remainingDovetails.slice(0, 3) : undefined,
                            remainingMore: remainingDovetails.length > 0 ? Math.max(0, remainingDovetails.length - 3) : undefined,
                            type: 'celebration', sessions: remainingDovetails.length > 0 ? upcomingDovetailSessions : undefined, ctas: remainingDovetails.length > 0 ? [dovetailInfoCta] : undefined
                        });
                    }
                } else {
                    items.push({
                        icon: '🎉', title: 'All 10 Dovetail Essentials Completed!',
                        description: 'Outstanding! You\'ve completed every Dovetail Essential session. Your practical digital skills are well-rounded.',
                        type: 'celebration'
                    });
                }

                if (pathwayStatus.hasAdoption && !hasDigitalSkills) {
                    items.push({
                        icon: '📖', title: 'Next: Digital Skills Course',
                        description: 'This four-week hybrid course helps educators shift from simply using technology to understanding how students learn with it. By adopting a learner-centred perspective, participants gain the digital wisdom needed to transform technical skills ("what" and "how") into thoughtful pedagogical decisions ("when" and "why").\n\nAs the next step in your learning pathway, this district-hosted course builds directly on your completed milestones. Because cohorts are offered by invitation only each term, join the waitlist today to signal your interest for the upcoming session.',
                        type: 'invitation', ctas: [getAvailabilityCTA('digitalskills')].filter(Boolean)
                    });
                }

                if (hasDigitalSkills && !hasCyberEffect) {
                    items.push({
                        icon: '🌐', title: 'Next: Cyber Effect Ambassador Course',
                        description: 'Deepen your impact by exploring the ethical, emotional, and behavioural dimensions of technology use. By mastering the 4P Affective Transformation Model—People, Practices, Pedagogy, and Platforms—you will gain the tools to embed cyber wellness, psychological safety, and human-centred design into your educational environment.\n\nAs the next step in your learning pathway, this course empowers you to champion a positive, reflective digital culture across your community.',
                        type: 'invitation', ctas: [getAvailabilityCTA('cybereffect')].filter(Boolean)
                    });
                }

                if (!pathwayStatus.hasThinkTank && totalSessions >= 15 && (hasDigitalSkills || hasCyberEffect || pathwayStatus.hasAdoption)) {
                    items.push({
                        icon: '💡', title: 'Start the Edvance ARC',
                        description: `Your strong PD engagement (${totalSessions} sessions) puts you on the path to being considered for the Facilitator Think Tank — the entry point to the Edvance ARC.\n\nThe Edvance ARC is a face-to-face leadership pathway for educators ready to guide digital growth. Through immersive workshops, it equips you with the vision and practical tools to lead sustainable transformation across your school community.`,
                        type: 'invitation', ctas: [{ label: 'Contact your eAdvisory Team', url: 'https://wcedeportal.co.za/meet-the-team', style: 'secondary' }]
                    });
                }

                return items;
            }, [pathwayStatus, upcomingData]);

            // === HISTORY TAB: filtering, grouping, metrics ===
            const filteredSessions = useMemo(() => {
                if (!results) return [];
                let filtered = results.allSessions;
                if (filters.level) filtered = filtered.filter(s => s['Development Level'] && s['Development Level'].toLowerCase().trim() === filters.level.toLowerCase().trim());
                if (filters.district) filtered = filtered.filter(s => s['Hosting District'] && s['Hosting District'].trim() === filters.district);
                if (filters.mode) filtered = filtered.filter(s => s['Delivery Mode'] && s['Delivery Mode'].trim() === filters.mode);
                if (filters.category === 'spark') filtered = filtered.filter(s => s.isSpark);
                if (filters.category === 'dovetail') filtered = filtered.filter(s => s.isDovetail);
                return filtered;
            }, [results, filters]);

            const sessionsByYear = useMemo(() => {
                const grouped = {};
                filteredSessions.forEach(session => {
                    const year = session.year;
                    if (!grouped[year]) grouped[year] = [];
                    grouped[year].push(session);
                });
                return Object.keys(grouped).sort((a, b) => b - a).map(year => ({ year, sessions: grouped[year] }));
            }, [filteredSessions]);

            const historyMetrics = useMemo(() => {
                if (!results) return null;
                const total = filteredSessions.length;
                const byLevel = { 'Laying the Foundation': 0, 'I can do it': 0, 'I can do it better': 0, 'The Summit': 0, 'Other': 0 };
                filteredSessions.forEach(session => {
                    const level = session['Development Level'] && session['Development Level'].trim();
                    if (byLevel.hasOwnProperty(level)) byLevel[level]++; else byLevel['Other']++;
                });
                const uniqueSparkSessions = [...new Set(results.allSessions.filter(s => s.isSpark).map(s => s['Session Name'] && s['Session Name'].trim()))];
                const uniqueDovetailSessions = [...new Set(results.allSessions.filter(s => s.isDovetail).map(s => s['Session Name'] && s['Session Name'].trim()))];
                const bonusSpark = uniqueDovetailSessions.length >= 5 ? 1 : 0;
                const totalSparks = uniqueSparkSessions.length + bonusSpark;
                return { total, byLevel, uniqueSparks: uniqueSparkSessions, uniqueDovetails: uniqueDovetailSessions, totalSparks, totalDovetails: uniqueDovetailSessions.length, hasBonusSpark: bonusSpark };
            }, [filteredSessions, results]);

            const filterOptions = useMemo(() => {
                if (!results) return { levels: [], districts: [], modes: [] };
                const levels = [...new Set(results.allSessions.map(s => s['Development Level'] && s['Development Level'].trim()).filter(Boolean))];
                const districts = [...new Set(results.allSessions.map(s => s['Hosting District'] && s['Hosting District'].trim()).filter(Boolean))].sort();
                const modes = [...new Set(results.allSessions.map(s => s['Delivery Mode'] && s['Delivery Mode'].trim()).filter(Boolean))].sort();
                return { levels, districts, modes };
            }, [results]);

            const isValidInput = () => {
                if (!searchValue.trim()) return false;
                if (searchType === 'id') return /^\d{13}$/.test(searchValue.trim());
                if (searchType === 'persal') return /^\d{8}$/.test(searchValue.trim());
                return false;
            };
            const canSearch = acknowledged && isValidInput() && !searching;

            // === RENDER ===
            if (loading) {
                return e('div', { className: "min-h-screen flex items-center justify-center bg-wcg-mist" },
                    e('div', { className: "text-center" },
                        e('div', { className: "animate-spin rounded-full h-12 w-12 border-b-2 border-wcg-blue mx-auto mb-4" }),
                        e('p', { className: "text-gray-500 text-sm font-medium" }, "Checking for saved details…")
                    )
                );
            }

            const navTabs = [
                { id: 'pathway', label: 'Pathway', icon: '🧭' },
                { id: 'nextsteps', label: 'Next Steps', icon: '📋', badge: suggestions.length || null },
                { id: 'history', label: 'History', icon: '🕒' }
            ];

            return e('div', { className: "min-h-screen bg-wcg-mist" },
                e('header', { className: "sticky top-0 z-30 bg-white/95 backdrop-blur shadow-sm no-print" },
                    e('div', { className: "max-w-2xl mx-auto px-4 py-3 flex justify-between items-center" },
                        e('img', { src: "header.png", alt: "WCED Header", className: "h-9 sm:h-11" }),
                        e('div', { className: "flex items-center gap-2" },
                            results && e('button', {
                                onClick: handleLogout,
                                className: "text-xs font-bold text-red-600 border border-red-200 rounded-full px-3 py-1.5 active:bg-red-50"
                            }, "Logout"),
                            e(Menu)
                        )
                    )
                ),

                e('div', { className: `max-w-2xl mx-auto px-4 py-5 print-full-width ${results ? 'pb-28' : 'pb-8'}` },
                    !results ? (
                        // === LOGIN / SEARCH FORM ===
                        e('div', { className: "animate-fade-in-up" },
                            e('div', { className: 'text-center mb-6 pt-2' },
                                e('div', { className: 'w-16 h-16 mx-auto rounded-2xl flex items-center justify-center text-3xl shadow-lg mb-4', style: { background: 'linear-gradient(135deg, #001489 0%, #C8126E 100%)' } }, '🧭'),
                                e('h1', { className: "font-display text-2xl font-bold text-wcg-dark mb-2" }, "My eLearning Professional Development"),
                                e('p', { className: "text-gray-500 text-sm px-2" }, "Track your progress on the Adoption & Transformation Pathway and view your full session history.")
                            ),
                            e('div', { className: "bg-white rounded-3xl shadow-sm border border-gray-100 p-6" },
                                e('div', { className: "mb-5" },
                                    e('label', { className: "block text-sm font-semibold text-gray-700 mb-2" }, "Search by"),
                                    e('div', { className: "flex gap-2 bg-wcg-mist p-1 rounded-xl" },
                                        e('button', {
                                            onClick: () => { setSearchType('persal'); setSearchValue(''); },
                                            className: `flex-1 py-2.5 px-3 rounded-lg text-sm font-bold transition-colors ${searchType === 'persal' ? 'bg-wcg-blue text-white shadow' : 'text-gray-500'}`
                                        }, "PERSAL Number"),
                                        e('button', {
                                            onClick: () => { setSearchType('id'); setSearchValue(''); },
                                            className: `flex-1 py-2.5 px-3 rounded-lg text-sm font-bold transition-colors ${searchType === 'id' ? 'bg-wcg-blue text-white shadow' : 'text-gray-500'}`
                                        }, "ID Number")
                                    )
                                ),
                                e('div', { className: "mb-5" },
                                    e('label', { className: "block text-sm font-semibold text-gray-700 mb-2" }, searchType === 'id' ? 'ID Number (13 digits)' : 'PERSAL Number (8 digits)'),
                                    e('input', {
                                        type: "text", inputMode: "numeric",
                                        value: searchValue,
                                        onChange: (ev) => setSearchValue(ev.target.value),
                                        onKeyPress: (ev) => ev.key === 'Enter' && canSearch && handleSearch(),
                                        placeholder: searchType === 'id' ? '1234567890123' : '12345678',
                                        className: "w-full px-4 py-3.5 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-wcg-blue focus:border-wcg-blue text-lg",
                                        maxLength: searchType === 'id' ? 13 : 8
                                    }),
                                    (searchValue && !isValidInput()) ? e('p', { className: "text-sm text-red-600 mt-1.5" }, `Please enter a valid ${searchType === 'id' ? '13-digit ID' : '8-digit PERSAL'} number`) : null
                                ),
                                e('label', { className: "flex items-start gap-3 cursor-pointer mb-4" },
                                    e('input', {
                                        type: "checkbox", checked: acknowledged,
                                        onChange: (ev) => setAcknowledged(ev.target.checked),
                                        className: "mt-0.5 h-5 w-5 text-wcg-blue border-gray-300 rounded focus:ring-wcg-blue flex-shrink-0"
                                    }),
                                    e('span', { className: "text-sm text-gray-600" }, "I confirm I am accessing my own professional development records for personal verification purposes only.")
                                ),
                                e('details', { className: "mb-5 bg-amber-50 border border-amber-200 rounded-xl overflow-hidden" },
                                    e('summary', { className: "px-4 py-2.5 text-xs font-bold text-amber-800 cursor-pointer select-none" }, "Data accuracy disclaimer"),
                                    e('p', { className: "px-4 pb-3 text-xs text-amber-800" },
                                        "This record is generated from self-captured attendance data. Every effort is made to ensure accuracy; discrepancies may occur due to manual entry errors. Please ensure consistency in your submissions to maintain an accurate transformation profile.",
                                        e('br'), e('strong', null, "Data last updated:"), ' ' + DATA_LAST_UPDATED
                                    )
                                ),
                                searchError && e('div', { className: 'mb-4 bg-red-50 border border-red-200 rounded-xl p-3 text-sm text-red-700' }, searchError),
                                e('button', {
                                    onClick: () => handleSearch(),
                                    disabled: !canSearch,
                                    className: `w-full py-3.5 px-4 rounded-xl font-bold text-base transition-colors ${canSearch ? 'bg-wcg-blue text-white active:bg-blue-800 shadow-lg' : 'bg-gray-200 text-gray-400'}`
                                }, searching ? 'Searching…' : 'View My PD')
                            )
                        )
                    ) : results.profile === null ? (
                        // === NO RECORDS FOUND ===
                        e('div', { className: "text-center animate-fade-in-up pt-6" },
                            e('div', { className: "bg-white rounded-3xl shadow-sm border border-gray-100 p-8" },
                                e('span', { className: "text-5xl block mb-4" }, "🔍"),
                                e('h2', { className: "font-display text-xl font-bold text-gray-800 mb-2" }, "No Records Found"),
                                e('p', { className: "text-gray-500 text-sm mb-6" }, `We couldn't find any PD records matching your search. Please check your ${searchType === 'id' ? 'ID' : 'PERSAL'} number and try again.`),
                                e('button', { onClick: handleLogout, className: "bg-wcg-blue text-white px-6 py-3 rounded-xl font-bold text-sm shadow" }, "Try Again")
                            )
                        )
                    ) : (
                        // === RESULTS DASHBOARD ===
                        e(React.Fragment, null,
                            e(ChecklistModal, {
                                isOpen: modalOpen.isOpen,
                                onClose: () => setModalOpen({ isOpen: false, type: null }),
                                type: modalOpen.type,
                                completedSessions: modalOpen.type === 'spark' ? (historyMetrics ? historyMetrics.uniqueSparks : []) : (historyMetrics ? historyMetrics.uniqueDovetails : []),
                                allSessions: results.allSessions
                            }),

                            e('div', { className: "space-y-5" },
                                e(DashboardHero, {
                                    profile: results.profile,
                                    pathwayStatus,
                                    onOpenPathway: () => setActiveTab('pathway'),
                                    onOpenDovetail: () => setModalOpen({ isOpen: true, type: 'dovetail' }),
                                    onOpenHistory: () => setActiveTab('history')
                                }),

                                e('div', { className: "no-print" },
                                    activeTab === 'pathway' && pathwayStatus ? e(PathwayTab, {
                                        pathwayStatus, onMilestoneClick: setSelectedMilestone
                                    }) : null,

                                    activeTab === 'nextsteps' ? e(NextStepsTab, {
                                        suggestions, onSessionClick: setSelectedSession
                                    }) : null,

                                    activeTab === 'history' ? e(HistoryTab, {
                                        profileName: results.profile.name,
                                        filteredSessions, sessionsByYear, filterOptions,
                                        filters, setFilters, viewMode, setViewMode
                                    }) : null
                                ),

                                // Always mounted, screen-hidden — this is what actually prints
                                e(PrintReport, {
                                    profileName: results.profile.name,
                                    profile: results.profile,
                                    allSessions: results.allSessions
                                }),

                                e('div', { className: "text-center text-[11px] text-gray-400 no-print pt-2 pb-2" },
                                    e('p', { className: "mb-1" },
                                        e('strong', null, "Disclaimer: "),
                                        "This record is generated from self-captured attendance data and may contain manual entry discrepancies."
                                    )
                                )
                            ),

                            e('button', {
                                onClick: () => window.print(),
                                'aria-label': 'Download attendance record',
                                className: "no-print fixed right-4 bottom-24 z-40 w-14 h-14 rounded-full bg-wcg-blue text-white shadow-xl flex items-center justify-center text-xl active:scale-95 transition-transform"
                            }, "⬇️"),

                            e(BottomNav, { tabs: navTabs, activeTab, onSelect: setActiveTab }),

                            (selectedMilestone !== null && pathwayStatus) ? e(MilestoneModal, {
                                milestone: MILESTONES[selectedMilestone],
                                status: pathwayStatus.milestoneStatuses[selectedMilestone],
                                pathwayStatus,
                                onClose: () => setSelectedMilestone(null)
                            }) : null,

                            selectedSession ? e(SessionDetailModal, { session: selectedSession, onClose: () => setSelectedSession(null) }) : null
                        )
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>

</html>
