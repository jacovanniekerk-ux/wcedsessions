        // ---------------------------------------------------------------
        // Date / time helpers (same logic used across the other pages)
        // ---------------------------------------------------------------
        const pad2 = (n) => String(n).padStart(2, '0');

        const parseDate = (dateStr) => {
            if (!dateStr) return new Date(8640000000000000);
            const d = new Date(`${dateStr}T00:00:00`);
            return isNaN(d.getTime()) ? new Date(8640000000000000) : d;
        };

        const SAST_OFFSET_MS = 2 * 60 * 60 * 1000;
        const getJoburgParts = (timestampMs) => {
            const shifted = new Date(timestampMs + SAST_OFFSET_MS);
            return { hours: shifted.getUTCHours(), minutes: shifted.getUTCMinutes() };
        };
        const toEpoch = (dateStr, timeStr) => {
            if (!dateStr || !timeStr) return null;
            const ts = new Date(`${dateStr}T${timeStr}+02:00`).getTime();
            return isNaN(ts) ? null : ts;
        };

        const formatDateDisplay = (dateObj) => {
            if (!dateObj || isNaN(dateObj.getTime())) return 'TBC';
            return dateObj.toLocaleDateString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric' });
        };

        const formatDateTime = (iso) => {
            if (!iso) return '—';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '—';
            return d.toLocaleString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Africa/Johannesburg' });
        };

        // ---------------------------------------------------------------
        // Supabase helpers
        // ---------------------------------------------------------------
        async function fetchAllRows(table, columns, applyFilters, pageSize = 1000) {
            let all = [];
            let from = 0;
            while (true) {
                let query = supabaseClient.from(table).select(columns);
                if (applyFilters) query = applyFilters(query);
                const { data, error } = await query.range(from, from + pageSize - 1);
                if (error) throw error;
                if (!data || data.length === 0) break;
                all = all.concat(data);
                if (data.length < pageSize) break;
                from += pageSize;
            }
            return all;
        }

        async function copyToClipboard(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (err) { console.error('Clipboard API failed, falling back:', err); }
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (err) {
                console.error('Clipboard fallback failed:', err);
                return false;
            }
        }

        function downloadCSV(filename, rows, headers) {
            const esc = (val) => `"${String(val ?? '').replace(/"/g, '""')}"`;
            const lines = [headers.map(h => esc(h.label)).join(',')]
                .concat(rows.map(row => headers.map(h => esc(row[h.key])).join(',')));
            const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ---------------------------------------------------------------
        // Loads sessions + registrations + a school -> district lookup,
        // then combines them into one array per session.
        //
        // Scope: this tool is about *pre-registration*, not attendance — so
        // it only ever looks at 'Virtual' sessions (the only ones the
        // Pre-Register widget appears on), from 21 days ago through to
        // whatever's upcoming. It does not touch attendance_staging at all.
        // ---------------------------------------------------------------
        async function loadAdminData() {
            const lookback = new Date();
            lookback.setDate(lookback.getDate() - 21);
            const lookbackISO = `${lookback.getFullYear()}-${pad2(lookback.getMonth() + 1)}-${pad2(lookback.getDate())}`;

            const [preregRows, sessionRows, courseRows, schoolRows] = await Promise.all([
                fetchAllRows('session_pre_registrations', 'id_key, name, email, school, created_at'),
                fetchAllRows('sessions', 'id_key, session_title, session_date, session_start_time, session_delivery_mode, hosting_unit',
                    q => q.eq('session_delivery_mode', 'Virtual').gte('session_date', lookbackISO)),
                fetchAllRows('courses', 'course_name, developmental_level, programme_duration'),
                fetchAllRows('schools', 'School_Name, Education_District')
            ]);

            // Real districts are derived from the schools table itself — never
            // hardcoded, since exact names/casing live in the data.
            const districts = Array.from(new Set(schoolRows.map(r => r.Education_District).filter(Boolean))).sort((a, b) => a.localeCompare(b));

            const schoolDistrictMap = new Map();
            schoolRows.forEach(r => { if (r.School_Name) schoolDistrictMap.set(r.School_Name, r.Education_District); });

            const registrationsByIdKey = new Map();
            preregRows.forEach(r => {
                const district = schoolDistrictMap.get(r.school);
                const bucket = (district && districts.includes(district)) ? district : UNKNOWN_DISTRICT;
                const enriched = { name: r.name, email: r.email, school: r.school, createdAt: r.created_at, district: bucket };
                if (!registrationsByIdKey.has(r.id_key)) registrationsByIdKey.set(r.id_key, []);
                registrationsByIdKey.get(r.id_key).push(enriched);
            });

            const coursesByName = new Map();
            courseRows.forEach(c => { if (c.course_name) coursesByName.set(c.course_name, c); });

            const allBuckets = districts.concat(UNKNOWN_DISTRICT);

            const sessions = sessionRows
                .map(s => {
                    const course = coursesByName.get(s.session_title) || {};
                    const durationMin = Number(course.programme_duration) || 0;
                    const startEpoch = toEpoch(s.session_date, s.session_start_time);
                    const endEpoch = startEpoch !== null ? startEpoch + durationMin * 60000 : null;
                    const startParts = startEpoch !== null ? getJoburgParts(startEpoch) : null;
                    const endParts = endEpoch !== null ? getJoburgParts(endEpoch) : null;
                    const timeDisplay = (startParts && endParts)
                        ? `${pad2(startParts.hours)}:${pad2(startParts.minutes)} - ${pad2(endParts.hours)}:${pad2(endParts.minutes)}`
                        : (startParts ? `${pad2(startParts.hours)}:${pad2(startParts.minutes)}` : '—');

                    const regs = (registrationsByIdKey.get(s.id_key) || []).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                    const districtCounts = {};
                    allBuckets.forEach(d => { districtCounts[d] = 0; });
                    regs.forEach(r => { districtCounts[r.district] = (districtCounts[r.district] || 0) + 1; });

                    return {
                        idKey: s.id_key,
                        name: s.session_title || 'Untitled Session',
                        dateISO: s.session_date || '',
                        time: timeDisplay,
                        level: course.developmental_level || '',
                        mode: s.session_delivery_mode || '—',
                        hostingUnit: s.hosting_unit || '',
                        totalRegistered: regs.length,
                        districtCounts,
                        registrants: regs
                    };
                })
                .filter(s => s.name !== 'Untitled Session');

            return { sessions, districts };
        }

        function SessionDetailModal({ session, onClose, showToast }) {
            const [search, setSearch] = useState('');

            const filtered = session.registrants.filter(r => {
                if (!search.trim()) return true;
                const q = search.toLowerCase();

            const handleCopyEmails = async () => {
                const emails = Array.from(new Set(session.registrants.map(r => r.email).filter(Boolean)));

                    e('div', { className: "p-5 sm:p-6 pb-3 flex flex-wrap items-center gap-2" },
                        e('button', {

                        }, e(Icons.Copy), `Copy All Emails (${session.totalRegistered})`),
                        e('button', {
                            onClick: handleDownloadCSV,
                            className: "inline-flex items-center gap-2 border-2 border-gray-300 hover:border-wcg-blue text-gray-700 font-bold text-sm px-3.5 py-2 rounded-lg transition-colors"
                        }, e(Icons.Download), "Download CSV"),
                        e('div', { className: "relative flex-1 min-w-[160px]" },
                            e('div', { className: "absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400" }, e(Icons.Search)),
                            e('input', {
                                type: "text", placeholder: "Filter registrants...", value: search,
                                onChange: (ev) => setSearch(ev.target.value),
                                className: "w-full pl-9 pr-3 py-2 border border-gray-200 rounded-lg bg-gray-50 focus:outline-none focus:bg-white focus:border-wcg-blue text-sm transition-all"
                            })
                        )
                    ),
                    e('div', { className: "overflow-auto flex-1 px-5 sm:px-6 pb-6" },
                        session.registrants.length === 0
                            ? e('p', { className: "text-sm text-gray-500 py-8 text-center" }, "No one has pre-registered for this session yet.")

                                e('thead', null,
                                    e('tr', { className: "border-b border-gray-200" },
                                        e('th', { className: "px-3 py-2 text-left text-[11px] font-bold uppercase tracking-wide text-gray-500" }, "Name"),
                                        e('th', { className: "px-3 py-2 text-left text-[11px] font-bold uppercase tracking-wide text-gray-500" }, "Email"),
                                        e('th', { className: "px-3 py-2 text-left text-[11px] font-bold uppercase tracking-wide text-gray-500" }, "School"),
                                        e('th', { className: "px-3 py-2 text-left text-[11px] font-bold uppercase tracking-wide text-gray-500" }, "District"),
                                        e('th', { className: "px-3 py-2 text-left text-[11px] font-bold uppercase tracking-wide text-gray-500" }, "Registered At")
                                    )
                                ),

                                        e('td', { className: "px-3 py-2.5 font-semibold text-gray-800" }, r.name || '—'),
                                        e('td', { className: "px-3 py-2.5 text-gray-600" }, r.email || '—'),

                                    ))

        function App() {
            const [sessions, setSessions] = useState([]);
            const [districts, setDistricts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [refreshKey, setRefreshKey] = useState(0);
            const [lastUpdated, setLastUpdated] = useState(null);

            const [searchTerm, setSearchTerm] = useState('');
            const [levelFilter, setLevelFilter] = useState('All');
            const [districtFilter, setDistrictFilter] = useState('All');
            const [sort, setSort] = useState({ key: 'date', dir: 'asc' });

            const [selectedSession, setSelectedSession] = useState(null);
            const [toast, setToast] = useState(null);
            const showToast = (kind, text) => { setToast({ kind, text }); setTimeout(() => setToast(null), 3500); };

            useEffect(() => {
                let cancelled = false;
                (async () => {
                    setLoading(true);
                    setError(null);
                    try {
                        const result = await loadAdminData();
                        if (!cancelled) {
                            setSessions(result.sessions);
                            setDistricts(result.districts);
                            setLastUpdated(new Date());
                        }
                    } catch (err) {
                        console.error('Error loading admin data:', err);
                        if (!cancelled) setError('Could not load session data. Please try refreshing.');
                    } finally {
                        if (!cancelled) setLoading(false);
                    }
                })();
                return () => { cancelled = true; };
            }, [refreshKey]);

            const levelOptions = useMemo(() => Array.from(new Set(sessions.map(s => s.level).filter(Boolean))).sort(), [sessions]);

            const filteredSessions = useMemo(() => {
                return sessions.filter(s => {
                    if (searchTerm && !s.name.toLowerCase().includes(searchTerm.toLowerCase())) return false;
                    if (levelFilter !== 'All' && s.level !== levelFilter) return false;
                    if (districtFilter !== 'All' && (s.districtCounts[districtFilter] || 0) === 0) return false;
                    return true;
                });
            }, [sessions, searchTerm, levelFilter, districtFilter]);

            const getSortValue = (s, key) => {
                if (key === 'name') return s.name.toLowerCase();
                if (key === 'date') return parseDate(s.dateISO).getTime();
                if (key === 'total') return s.totalRegistered;
                return s.districtCounts[key] || 0;
            };

            const sortedSessions = useMemo(() => {
                const copy = [...filteredSessions];
                copy.sort((a, b) => {
                    const av = getSortValue(a, sort.key), bv = getSortValue(b, sort.key);
                    if (av < bv) return sort.dir === 'asc' ? -1 : 1;
                    if (av > bv) return sort.dir === 'asc' ? 1 : -1;
                    return 0;
                });
                return copy;
            }, [filteredSessions, sort]);

            const handleSort = (key) => {
                setSort(prev => prev.key === key ? { key, dir: prev.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' });
            };

            const clearFilters = () => {
                setSearchTerm(''); setLevelFilter('All'); setDistrictFilter('All');
            };

            const totalRegistrations = filteredSessions.reduce((sum, s) => sum + s.totalRegistered, 0);
            const uniqueRegistrants = useMemo(() => {
                const emails = new Set();
                filteredSessions.forEach(s => s.registrants.forEach(r => { if (r.email) emails.add(r.email.trim().toLowerCase()); }));
                return emails.size;
            }, [filteredSessions]);
            const districtTotals = useMemo(() => {
                const totals = {};
                districts.concat(UNKNOWN_DISTRICT).forEach(d => { totals[d] = 0; });
                filteredSessions.forEach(s => districts.concat(UNKNOWN_DISTRICT).forEach(d => { totals[d] += s.districtCounts[d] || 0; }));
                return totals;
            }, [filteredSessions, districts]);
            const topDistrict = useMemo(() => {
                const entries = Object.entries(districtTotals).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
                return entries.length > 0 ? entries[0] : null;
            }, [districtTotals]);

            const handleDownloadOverviewCSV = () => {
                const allBuckets = districts.concat(UNKNOWN_DISTRICT);
                const headers = [
                    { key: 'name', label: 'Session' },
                    { key: 'date', label: 'Date' },
                    { key: 'time', label: 'Time' },
                    { key: 'level', label: 'Level' },
                    { key: 'total', label: 'Total Registered' },
                    ...allBuckets.map(d => ({ key: d, label: d }))
                ];
                const rows = sortedSessions.map(s => {
                    const row = { name: s.name, date: s.dateISO, time: s.time, level: s.level, total: s.totalRegistered };
                    allBuckets.forEach(d => { row[d] = s.districtCounts[d] || 0; });
                    return row;
                });
                downloadCSV('session-registrations-overview.csv', rows, headers);
            };

            if (loading) {
                return e('div', { className: "min-h-screen flex flex-col items-center justify-center text-gray-400" }, e(Icons.Loader), e('p', { className: "mt-3 text-sm" }, "Loading session data…"));
            }

            return e('div', { className: "min-h-screen pb-16 font-sans bg-gray-50" },
                e('header', { className: "bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm" },
                    e('div', { className: "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 md:py-4" },
                        e('div', { className: "flex items-center justify-between gap-3 flex-wrap" },
                            e('div', { className: "flex items-center gap-3" },
                                e('img', { src: "header.png", alt: "WCG Logo", className: "h-9 md:h-12 w-auto object-contain" }),
                                e('div', null,
                                    e('h1', { className: "text-base md:text-lg font-bold font-accent text-gray-900" }, "Session Registrations"),
                                    e('p', { className: "text-xs text-gray-500" }, "Virtual sessions · last 21 days + upcoming · pre-registration counts")
                                )
                            ),
                            e('div', { className: "flex items-center gap-2" },
                                lastUpdated ? e('span', { className: "text-xs text-gray-400 hidden sm:inline" }, `Updated ${lastUpdated.toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit' })}`) : null,
                                e('button', {
                                    onClick: () => setRefreshKey(k => k + 1),
                                    className: "inline-flex items-center gap-2 border-2 border-gray-300 hover:border-wcg-blue text-gray-700 font-bold text-xs px-3 py-2 rounded-lg transition-colors"
                                }, e(Icons.RefreshCw), "Refresh"),
                                e('a', { href: "sessions.html", className: "text-xs font-semibold text-wcg-blue underline underline-offset-2 hover:text-blue-800" }, "Upcoming Sessions ↗")
                            )
                        )
                    )
                ),

                e('div', { className: "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" },
                    e('div', { className: "mt-3 bg-yellow-50 border border-yellow-200 text-yellow-800 text-xs rounded-lg px-3 py-2" },
                        "Internal tool — no authentication is enforced yet. Access will be restricted in a future update."
                    ),

                    error ? e('div', { className: "mt-6 text-center py-10" },
                        e('div', { className: "mx-auto mb-3 h-10 w-10 rounded-full bg-red-50 text-wcg-red flex items-center justify-center" }, e(Icons.AlertTriangle)),
                        e('p', { className: "text-sm text-gray-600 mb-3" }, error),
                        e('button', { onClick: () => setRefreshKey(k => k + 1), className: "bg-wcg-blue text-white font-bold text-sm px-4 py-2 rounded-lg" }, "Try Again")
                    ) : e(React.Fragment, null,

                        // --- Summary cards ---
                        e('div', { className: "mt-4 grid grid-cols-2 sm:grid-cols-4 gap-3" },
                            e(StatCard, { label: "Sessions Shown", value: filteredSessions.length }),
                            e(StatCard, { label: "Total Registrations", value: totalRegistrations }),
                            e(StatCard, { label: "Unique Registrants", value: uniqueRegistrants }),
                            e(StatCard, { label: "Top District", value: topDistrict ? topDistrict[1] : '—', sub: topDistrict ? topDistrict[0] : 'No data yet' })
                        ),

                        // --- Filters ---
                        e('div', { className: "mt-5 bg-white rounded-xl border border-gray-200 shadow-sm p-4 flex flex-wrap items-center gap-2" },
                            e('div', { className: "relative flex-1 min-w-[180px]" },
                                e('div', { className: "absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400" }, e(Icons.Search)),
                                e('input', {
                                    type: "text", placeholder: "Search session name...", value: searchTerm,
                                    onChange: (ev) => setSearchTerm(ev.target.value),
                                    className: "w-full pl-9 pr-3 py-2 border border-gray-200 rounded-lg bg-gray-50 focus:outline-none focus:bg-white focus:border-wcg-blue text-sm transition-all"
                                })
                            ),
                            e('select', {
                                value: levelFilter, onChange: (ev) => setLevelFilter(ev.target.value),
                                className: "border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:border-wcg-blue"
                            }, e('option', { value: "All" }, "All Levels"), levelOptions.map(l => e('option', { key: l, value: l }, l))),
                            e('select', {
                                value: districtFilter, onChange: (ev) => setDistrictFilter(ev.target.value),
                                className: "border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:border-wcg-blue"
                            }, e('option', { value: "All" }, "All Districts"), districts.concat(UNKNOWN_DISTRICT).map(d => e('option', { key: d, value: d }, d))),
                            e('button', { onClick: clearFilters, className: "text-xs font-semibold text-gray-500 hover:text-wcg-blue underline underline-offset-2" }, "Clear"),
                            e('button', {
                                onClick: handleDownloadOverviewCSV,
                                className: "ml-auto inline-flex items-center gap-2 border-2 border-gray-300 hover:border-wcg-blue text-gray-700 font-bold text-xs px-3 py-2 rounded-lg transition-colors"
                            }, e(Icons.Download), "Export Overview CSV")
                        ),

                        // --- Sessions table ---
                        e('div', { className: "mt-4 bg-white rounded-xl border border-gray-200 shadow-sm overflow-x-auto" },
                            sortedSessions.length === 0
                                ? e('p', { className: "text-sm text-gray-500 py-10 text-center" }, "No sessions match these filters.")
                                : e('table', { className: "w-full text-sm" },
                                    e('thead', { className: "bg-gray-50" },
                                        e('tr', { className: "border-b border-gray-200" },
                                            e(SortHeader, { label: "Session", sortKey: "name", sort, onSort: handleSort }),
                                            e(SortHeader, { label: "Date", sortKey: "date", sort, onSort: handleSort }),
                                            e('th', { className: "px-3 py-2.5 text-left text-[11px] font-bold uppercase tracking-wide text-gray-500" }, "Time"),
                                            e('th', { className: "px-3 py-2.5 text-left text-[11px] font-bold uppercase tracking-wide text-gray-500" }, "Level"),
                                            e(SortHeader, { label: "Total", sortKey: "total", sort, onSort: handleSort }),
                                            districts.map(d => e(SortHeader, { key: d, label: d, sortKey: d, sort, onSort: handleSort })),
                                            e(SortHeader, { label: UNKNOWN_DISTRICT, sortKey: UNKNOWN_DISTRICT, sort, onSort: handleSort }),
                                            e('th', { className: "px-3 py-2.5 text-left text-[11px] font-bold uppercase tracking-wide text-gray-500" }, "")
                                        )
                                    ),
                                    e('tbody', null,
                                        sortedSessions.map(s => e('tr', {
                                            key: s.idKey,
                                            className: "border-b border-gray-50 hover:bg-blue-50/50 cursor-pointer transition-colors",
                                            onClick: () => setSelectedSession(s)
                                        },
                                            e('td', { className: "px-3 py-3 font-semibold text-gray-800" }, s.name),
                                            e('td', { className: "px-3 py-3 text-gray-600" }, formatDateDisplay(parseDate(s.dateISO))),
                                            e('td', { className: "px-3 py-3 text-gray-600" }, s.time),
                                            e('td', { className: "px-3 py-3" }, s.level ? e(Badge, { type: "level" }, s.level) : '—'),
                                            e('td', { className: "px-3 py-3 font-bold text-gray-900" }, s.totalRegistered),
                                            districts.map(d => e('td', { key: d, className: "px-3 py-3 text-gray-500 text-center" }, s.districtCounts[d] || 0)),
                                            e('td', { className: "px-3 py-3 text-gray-500 text-center" }, s.districtCounts[UNKNOWN_DISTRICT] || 0),
                                            e('td', { className: "px-3 py-3" },
                                                e('button', {
                                                    onClick: (ev) => { ev.stopPropagation(); setSelectedSession(s); },
                                                    className: "text-xs font-bold text-wcg-blue hover:underline"
                                                }, "View →")
                                            )
                                        ))
                                    )
                                )
                        )
                    )
                ),

                selectedSession ? e(SessionDetailModal, { session: selectedSession, onClose: () => setSelectedSession(null), showToast }) : null,
                e(Toast, { toast })
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    </script>
</body>

</html>
