    <link rel="icon" type="image/png" href="favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wcg: {
                            blue: '#001489',
                            green2: '#8FAD15',
                            grey: '#968C83',
                            red: '#BA0C2F',
                            yellow: '#FFC600',

                            lightBg: '#F3F4F6'

                    },
                    fontFamily: {
                        sans: ['Century Gothic', 'Didact Gothic', 'Segoe UI', 'sans-serif'],
                        accent: ['Gotham', 'Montserrat', 'sans-serif']

                    animation: {
                        'bounce-slight': 'bounce-slight 0.3s ease-in-out',
                        'pulse-glow': 'pulse-glow 2s ease-in-out infinite',
                    },
                    keyframes: {
                        'bounce-slight': {
                            '0%, 100%': { transform: 'translateY(0)' },

                                transform: 'scale(1)',
                                boxShadow: '0 0 0 0 rgba(238, 59, 59, 0.7)'

                            '50%': {
                                transform: 'scale(1.05)',
                                boxShadow: '0 0 20px 10px rgba(238, 59, 59, 0)'

            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .icon-hover:hover svg {
            animation: bounce-slight 0.5s ease-in-out;
            color: #004B87;
        }

<body class="bg-gray-50 text-wcg-darkText font-sans">

    <div id="root"></div>

    <script>
        const { useState, useMemo, useEffect, useRef, useCallback } = React;
        const e = React.createElement;

        // ---------------------------------------------------------------
        // Supabase configuration
        // ---------------------------------------------------------------
        const SUPABASE_URL = 'https://cftpufjzwpmhgzdcgpjb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_b1H_5DJYLQSrr83T_dvz6A_2UAqOVg4';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const Icons = {
            Calendar: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "18", height: "18", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('rect', { width: "18", height: "18", x: "3", y: "4", rx: "2", ry: "2" }), e('line', { x1: "16", x2: "16", y1: "2", y2: "6" }), e('line', { x1: "8", x2: "8", y1: "2", y2: "6" }), e('line', { x1: "3", x2: "21", y1: "10", y2: "10" })),
            Search: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "20", height: "20", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('circle', { cx: "11", cy: "11", r: "8" }), e('path', { d: "m21 21-4.3-4.3" })),
            ChevronDown: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('path', { d: "m6 9 6 6 6-6" })),
            ChevronUp: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('path', { d: "m18 15-6-6-6 6" })),
            ExternalLink: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('path', { d: "M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" }), e('polyline', { points: "15 3 21 3 21 9" }), e('line', { x1: "10", x2: "21", y1: "14", y2: "3" })),
            Clock: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('circle', { cx: "12", cy: "12", r: "10" }), e('polyline', { points: "12 6 12 12 16 14" })),
            Info: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('circle', { cx: "12", cy: "12", r: "10" }), e('path', { d: "M12 16v-4" }), e('path', { d: "M12 8h.01" })),
            CalendarCheck: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('rect', { width: "18", height: "18", x: "3", y: "4", rx: "2", ry: "2" }), e('line', { x1: "16", x2: "16", y1: "2", y2: "6" }), e('line', { x1: "8", x2: "8", y1: "2", y2: "6" }), e('line', { x1: "3", x2: "21", y1: "10", y2: "10" }), e('path', { d: "m9 16 2 2 4-4" })),
            CalendarPlus: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('rect', { width: "18", height: "18", x: "3", y: "4", rx: "2", ry: "2" }), e('line', { x1: "16", x2: "16", y1: "2", y2: "6" }), e('line', { x1: "8", x2: "8", y1: "2", y2: "6" }), e('line', { x1: "3", x2: "21", y1: "10", y2: "10" }), e('line', { x1: "10", x2: "14", y1: "16", y2: "16" }), e('line', { x1: "12", x2: "12", y1: "14", y2: "18" })),
            Loader: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "32", height: "32", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round", className: "spin" }, e('path', { d: "M21 12a9 9 0 1 1-6.219-8.56" })),
            AlertTriangle: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "24", height: "24", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('path', { d: "m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" }), e('line', { x1: "12", x2: "12", y1: "9", y2: "13" }), e('line', { x1: "12", x2: "12.01", y1: "17", y2: "17" })),
            Video: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('path', { d: "m22 8-6 4 6 4V8Z" }), e('rect', { width: "14", height: "12", x: "2", y: "6", rx: "2", ry: "2" })),
            RefreshCw: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('path', { d: "M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" }), e('path', { d: "M3 3v5h5" }), e('path', { d: "M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" }), e('path', { d: "M16 16h5v5" }))
        };

        // ---------------------------------------------------------------
        // Date / time helpers
        // ---------------------------------------------------------------
        const WEEKDAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const SAST_OFFSET_MS = 2 * 60 * 60 * 1000; // Africa/Johannesburg is a fixed UTC+2, no DST

        const pad2 = (n) => String(n).padStart(2, '0');

        // Parses a 'YYYY-MM-DD' string (as returned by Supabase for a `date` column)
        // into a local JS Date representing that calendar day.
        const parseDate = (dateStr) => {
            if (!dateStr) return new Date(8640000000000000);
            const d = new Date(`${dateStr}T00:00:00`);
            return isNaN(d.getTime()) ? new Date(8640000000000000) : d;
        };

        // Given a UTC epoch timestamp, returns the wall-clock components for
        // that instant in the fixed Africa/Johannesburg (UTC+2) timezone.
        const getJoburgParts = (timestampMs) => {
            const shifted = new Date(timestampMs + SAST_OFFSET_MS);
            return {
                year: shifted.getUTCFullYear(),
                month: shifted.getUTCMonth() + 1,
                day: shifted.getUTCDate(),
                hours: shifted.getUTCHours(),
                minutes: shifted.getUTCMinutes(),
                seconds: shifted.getUTCSeconds(),
                weekdayIdx: shifted.getUTCDay()
            };
        };

        // Combines a 'YYYY-MM-DD' date and a 'HH:MM:SS' time (both as returned
        // by Supabase) into a UTC epoch timestamp, treating the pair as SAST.
        const toEpoch = (dateStr, timeStr) => {
            if (!dateStr || !timeStr) return null;
            const ts = new Date(`${dateStr}T${timeStr}+02:00`).getTime();
            return isNaN(ts) ? null : ts;
        };

        const formatCountdown = (diffMs) => {
            if (diffMs <= 0) return "00:00:00";
            const totalSeconds = Math.floor(diffMs / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        };

        const getMonthYear = (dateObj) => {
            if (isNaN(dateObj.getTime())) return "Unscheduled";
            return dateObj.toLocaleString('default', { month: 'long', year: 'numeric' });
        };

        const isToday = (dateObj) => {
            const today = new Date();
            return dateObj.getDate() === today.getDate() &&
                dateObj.getMonth() === today.getMonth() &&
                dateObj.getFullYear() === today.getFullYear();
        };

        const isFutureOrToday = (dateObj) => {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            dateObj.setHours(0, 0, 0, 0);
            return dateObj >= today;
        };

        // ---------------------------------------------------------------
        // Dynamic link builders
        // ---------------------------------------------------------------

        // Google Forms pre-fill links encode spaces as "+" and only percent-encode
        // characters like [ ] (i.e. encodeURI() output, with %20 swapped for +).
        const encodeForFormEntry = (str) => encodeURI(str).replace(/%20/g, '+');

        const buildRegisterLink = ({ startParts, district, name, id }) => {
            const dateTimeStr = `${WEEKDAY_NAMES[startParts.weekdayIdx]}, ${MONTH_NAMES[startParts.month - 1]} ${startParts.day} @ ${pad2(startParts.hours)}:${pad2(startParts.minutes)}`;
            const raw = `${dateTimeStr} - (${(district || '').toUpperCase()}) - ${name} [${id}]`;
            const encoded = encodeForFormEntry(raw);
            return `https://docs.google.com/forms/d/e/1FAIpQLScMwanHrYwf9_kOML0icuKE9VfoFXD703of7ETLR5z6ysZoxA/viewform?usp=pp_url&entry.1422040156=${encoded}`;
        };

        const buildGoogleCalendarLink = ({ startParts, endParts, name, description, joinLink }) => {
            const fmt = (p) => `${p.year}${pad2(p.month)}${pad2(p.day)}T${pad2(p.hours)}${pad2(p.minutes)}${pad2(p.seconds)}`;
            const text = `\u{1F4BB} eTPD Webinar: ${name}`;
            const details = `${description || ''}\n\n\u{1F517} Join Link: \n${joinLink || ''}\n\n\u2139\uFE0F For more info: https://bit.ly/m/wcedtpd`;
            return `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(text)}&dates=${fmt(startParts)}/${fmt(endParts)}&details=${encodeURIComponent(details)}&location=MS%20Teams&ctz=Africa/Johannesburg`;
        };

        const buildOutlookLink = ({ startParts, endParts, name, joinLink }) => {
            const iso = (p) => `${p.year}-${pad2(p.month)}-${pad2(p.day)}T${pad2(p.hours)}:${pad2(p.minutes)}:${pad2(p.seconds)}`;
            const body = `Join Link: ${joinLink || ''}`;
            return `https://outlook.office.com/calendar/0/action/compose?allday=false&body=${encodeURIComponent(body)}&enddt=${encodeURIComponent(iso(endParts))}&location=Virtual%20Session&path=/calendar/action/compose&rru=addevent&startdt=${encodeURIComponent(iso(startParts))}&subject=${encodeURIComponent(name)}`;
        };

        // ---------------------------------------------------------------
        // Combine `session` + `courses` rows fetched from Supabase into the
        // shape the UI needs (this replaces the old CSV row processing).
        // ---------------------------------------------------------------
        const combineSessionsAndCourses = (sessionRows, courseRows) => {
            const coursesByName = new Map();
            (courseRows || []).forEach(c => {
                if (c.course_name) coursesByName.set(c.course_name, c);
            });

            return (sessionRows || [])
                .filter(s => s.session_delivery_mode === 'Virtual')
                .map(s => {
                    const course = coursesByName.get(s.session_title) || {};
                    const durationMin = Number(course.programme_duration) || 0;

                    const startEpoch = toEpoch(s.session_date, s.session_start_time);
                    const endEpoch = startEpoch !== null ? startEpoch + durationMin * 60000 : null;

                    const startParts = startEpoch !== null ? getJoburgParts(startEpoch) : null;
                    const endParts = endEpoch !== null ? getJoburgParts(endEpoch) : null;

                    const dateISO = s.session_date || '';
                    const timeDisplay = (startParts && endParts)
                        ? `${pad2(startParts.hours)}:${pad2(startParts.minutes)} - ${pad2(endParts.hours)}:${pad2(endParts.minutes)}`
                        : '';

                    const district = s.hosting_unit || 'Unspecified';
                    const name = s.session_title || 'Untitled Session';

                    const registerLink = startParts
                        ? buildRegisterLink({ startParts, district, name, id: s.id_key })
                        : '';
                    const googleCal = (startParts && endParts)
                        ? buildGoogleCalendarLink({ startParts, endParts, name, description: course.session_desciption, joinLink: s.session_link })
                        : '#';
                    const outlookCal = (startParts && endParts)
                        ? buildOutlookLink({ startParts, endParts, name, joinLink: s.session_link })
                        : '#';

                    return {
                        id: s.id_key,
                        date: dateISO,
                        time: timeDisplay,
                        term: '',
                        district,
                        name,
                        level: course.developmental_level || '',
                        description: course.session_desciption || '',
                        outcomes: course.session_outcomes || '',
                        registerLink,
                        googleCal,
                        outlookCal,
                        joinLink: s.session_link || '',
                        startTimestamp: startEpoch,
                        endTimestamp: endEpoch
                    };
                })
                .filter(s => s.name !== 'Untitled Session');
        };

        const Badge = ({ children, type = 'default' }) => {
            let colorClass = 'bg-gray-100 text-gray-700 border-gray-200';
            const text = (children || '').toString();
            const level = text.toLowerCase();

            if (type === 'level') {
                if (level.includes('foundation')) colorClass = 'bg-wcg-green text-white border-wcg-green';
                else if (level.includes('better')) colorClass = 'bg-wcg-red text-white border-wcg-red';
                else if (level.includes('i can')) colorClass = 'bg-wcg-yellow text-gray-900 border-wcg-yellow';
                else if (level.includes('summit')) colorClass = 'bg-wcg-blue text-white border-wcg-blue';
            } else if (type === 'district') {
                colorClass = 'bg-white text-wcg-blue border-wcg-blue/30 border';
            } else if (type === 'term') {
                colorClass = 'bg-gray-100 text-gray-600 border-gray-200 border';
            }

            return e('span', { className: `px-2 py-0.5 rounded-md text-[11px] font-bold uppercase tracking-wide border ${colorClass} shadow-sm` }, children);
        };

        const SessionCard = ({ session, currentTime = Date.now() }) => {
            const [isExpanded, setIsExpanded] = useState(false);
            const dateObj = parseDate(session.date);
            const isTodaySession = isToday(dateObj);

            const start = session.startTimestamp ?? null;
            const end = session.endTimestamp ?? null;

            const hasValidTimes = start !== null && end !== null;
            const isBeforeStart = hasValidTimes && currentTime < start;
            const hasStarted = hasValidTimes && currentTime >= start;
            const hasConcluded = hasValidTimes && currentTime > end;
            const isJoinable = hasValidTimes && currentTime >= (start - 30 * 60 * 1000) && currentTime <= end;

            const renderActionSection = () => {
                if (isTodaySession) {
                    if (hasConcluded) {
                        return e('div', { className: "flex items-center justify-center bg-gray-200 text-gray-500 font-bold font-accent py-4 px-6 rounded-lg shadow-inner uppercase tracking-wider text-sm" }, "Session Concluded");
                    }
                    if (isJoinable && session.joinLink) {
                        return e('div', { className: "flex flex-col space-y-2 w-full" },
                            !hasStarted && e('div', { className: "text-center text-sm font-bold text-wcg-blue mb-1" }, "Starts in: ", e('span', { className: "font-mono" }, formatCountdown(start - currentTime))),
                            e('a', { href: session.joinLink, target: "_blank", rel: "noopener noreferrer", className: "flex items-center justify-center bg-wcg-red hover:bg-red-700 text-white font-bold font-accent py-4 px-6 rounded-lg transition-all text-lg shadow-lg animate-pulse-glow w-full" },
                                e(Icons.Video), e('span', { className: "ml-3" }, "JOIN NOW")
                            )
                        );
                    }
                    if (isBeforeStart) {
                        return e('div', { className: "flex flex-col items-center justify-center py-3 px-4 bg-blue-50 border border-blue-100 rounded-lg w-full" },
                            e('span', { className: "text-[10px] text-gray-500 uppercase tracking-widest mb-1 font-bold" }, "Starts In"),
                            e('span', { className: "text-2xl font-bold font-accent text-wcg-blue font-mono tracking-wider" }, formatCountdown(start - currentTime))
                        );
                    }
                    if (session.joinLink) {
                        return e('a', { href: session.joinLink, target: "_blank", rel: "noopener noreferrer", className: "flex items-center justify-center bg-wcg-red hover:bg-red-700 text-white font-bold font-accent py-4 px-6 rounded-lg transition-all text-lg shadow-lg animate-pulse-glow w-full" },
                            e(Icons.Video), e('span', { className: "ml-3" }, "JOIN NOW")
                        );
                    }
                    return e('div', { className: "flex items-center justify-center bg-gray-50 text-gray-400 font-bold py-3 px-6 rounded-lg border border-gray-100 uppercase tracking-wide text-xs w-full" }, "Session Today");
                }

                return e('div', { className: "grid grid-cols-1 sm:grid-cols-2 gap-3 w-full" },
                    e('a', { href: session.registerLink, target: "_blank", rel: "noopener noreferrer", className: `col-span-1 sm:col-span-2 flex items-center justify-center bg-wcg-blue hover:bg-blue-800 text-white font-bold font-accent py-2.5 px-4 rounded-lg transition-all text-sm shadow-sm hover:shadow active:scale-95 icon-hover ${!session.registerLink ? 'opacity-50 pointer-events-none' : ''}` },
                        e('span', { className: "mr-2" }, "Register Now"), e(Icons.ExternalLink)
                    ),
                    e('a', { href: session.googleCal, target: "_blank", rel: "noreferrer", className: "flex items-center justify-center bg-white border border-gray-200 hover:border-wcg-blue hover:bg-blue-50 text-gray-600 font-medium py-2 px-2 rounded-lg text-xs transition-colors icon-hover" },
                        e('span', { className: "mr-1.5 text-wcg-blue" }, e(Icons.CalendarPlus)), " Google"
                    ),
                    e('a', { href: session.outlookCal, target: "_blank", rel: "noreferrer", className: "flex items-center justify-center bg-white border border-gray-200 hover:border-wcg-blue hover:bg-blue-50 text-gray-600 font-medium py-2 px-2 rounded-lg text-xs transition-colors icon-hover" },
                        e('span', { className: "mr-1.5 text-blue-400" }, e(Icons.CalendarCheck)), " Outlook"
                    )
                );
            };

            const formatOutcomes = (text) => {
                if (!text) return null;
                const items = text.split(/\n|⮚|>/).filter(item => item.trim().length > 0);
                if (items.length <= 1) return e('p', { className: "text-gray-600 text-sm mt-2" }, text);
                return e('ul', { className: "mt-3 space-y-2" },
                    items.map((item, idx) => e('li', { key: idx, className: "text-gray-600 text-sm flex items-start" },
                        e('span', { className: "mr-2 mt-1.5 w-1.5 h-1.5 bg-wcg-blue rounded-full flex-shrink-0" }),
                        e('span', null, item.trim())
                    ))
                );
            };

            return e('div', { className: "bg-white rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.08)] border border-gray-200 overflow-hidden hover:shadow-[0_8px_16px_rgba(0,0,0,0.12)] transition-all duration-300 flex flex-col h-full fade-in group font-sans" },
                e('div', { className: "bg-gray-50 border-b border-gray-100 p-4 flex justify-between items-center" },
                    e('div', { className: "flex flex-col" },
                        e('div', { className: "flex items-center space-x-2 text-wcg-blue font-bold font-accent" },
                            e(Icons.Calendar),
                            e('span', null, dateObj.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }))
                        ),
                        session.time && e('div', { className: "flex items-center space-x-2 text-gray-600 text-sm mt-1 ml-6" },
                            e(Icons.Clock), e('span', null, session.time)
                        )
                    ),
                    e(Badge, { type: "district" }, session.district)
                ),
                e('div', { className: "p-5 flex-grow flex flex-col" },
                    e('div', { className: "flex flex-wrap gap-2 mb-3" },
                        e(Badge, { type: "level" }, session.level),
                        session.term && e(Badge, { type: "term" }, session.term)
                    ),
                    e('h3', { className: "text-lg font-bold font-accent text-gray-900 mb-2 leading-tight group-hover:text-wcg-blue transition-colors" }, session.name),
                    e('div', { className: "text-gray-600 text-sm leading-relaxed mb-4 flex-grow" },
                        isExpanded ? session.description : `${session.description?.substring(0, 100) || ''}...`,
                        isExpanded && e('div', { className: "mt-4 pt-4 border-t border-gray-100 fade-in bg-blue-50/30 -mx-2 px-3 pb-2 rounded-lg" },
                            e('h4', { className: "text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 flex items-center gap-2" },
                                e(Icons.Info), " Learning Outcomes"
                            ),
                            formatOutcomes(session.outcomes)
                        )
                    ),
                    e('button', {
                        onClick: () => setIsExpanded(!isExpanded),
                        className: "text-wcg-blue text-xs font-bold uppercase tracking-wide flex items-center hover:text-wcg-red transition-colors focus:outline-none self-start mt-auto icon-hover"
                    }, isExpanded ? [ "Show Less ", e('span', { className: "ml-1" }, e(Icons.ChevronUp)) ] : [ "Read More ", e('span', { className: "ml-1" }, e(Icons.ChevronDown)) ])
                ),
                e('div', { className: "p-4 bg-white border-t border-gray-100 flex-none flex items-center justify-center" }, renderActionSection())
            );
        };

        const App = () => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedDistrict, setSelectedDistrict] = useState('All');
            const [selectedSessionName, setSelectedSessionName] = useState('All');
            const [menuOpen, setMenuOpen] = useState(false);
            const [currentTime, setCurrentTime] = useState(Date.now());

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(Date.now()), 1000);
                return () => clearInterval(timer);
            }, []);

            const fetchData = useCallback(async () => {
                setLoading(true);
                setError(null);
                try {
                    const [sessionRes, courseRes] = await Promise.all([
                        supabaseClient .from('sessions')
                        .select('*')
                        .eq('session_delivery_mode', 'Virtual')
                        .gte('session_date', new Date().toISOString().slice(0, 10)) // today onward, 'YYYY-MM-DD'
                        .order('session_date', { ascending: true }),
                        supabaseClient.from('courses').select('*')
                    ]);

                    if (sessionRes.error) throw sessionRes.error;
                    if (courseRes.error) throw courseRes.error;

                    const combined = combineSessionsAndCourses(sessionRes.data, courseRes.data);

                    if (combined.length > 0) {
                        setData(combined);
                    } else {
                        setData([]);
                        setError('empty');
                    }
                } catch (err) {
                    console.error('Failed to load sessions from Supabase:', err);
                    setError('failed_fetch');
                } finally {
                    setLoading(false);
                }
            }, []);

            useEffect(() => {
                fetchData();
            }, [fetchData]);

            const districts = useMemo(() => ['All', ...new Set(data.map(s => s.district).filter(Boolean).sort())], [data]);
            const sessionNames = useMemo(() => ['All', ...new Set(data.map(s => s.name).filter(Boolean).sort())], [data]);

            const filteredSessions = useMemo(() => {
                return data.filter(session => {
                    const sessionDate = parseDate(session.date);
                    if (!isFutureOrToday(sessionDate)) return false;

                    const matchesSearch = (session.name || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (session.description || '').toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesDistrict = selectedDistrict === 'All' || session.district === selectedDistrict;
                    const matchesSessionName = selectedSessionName === 'All' || session.name === selectedSessionName;

                    return matchesSearch && matchesDistrict && matchesSessionName;
                }).sort((a, b) => parseDate(a.date) - parseDate(b.date));
            }, [data, searchTerm, selectedDistrict, selectedSessionName]);

            const groupedSessions = useMemo(() => {
                const groups = {};
                filteredSessions.forEach(session => {
                    const date = parseDate(session.date);
                    const monthKey = getMonthYear(date);
                    if (!groups[monthKey]) groups[monthKey] = [];
                    groups[monthKey].push(session);
                });
                return groups;
            }, [filteredSessions]);

            if (loading) {
                return e('div', { className: "min-h-screen flex flex-col items-center justify-center bg-gray-50 text-wcg-blue" },
                    e(Icons.Loader),
                    e('h2', { className: "text-xl font-bold mt-4 font-accent" }, "Loading Sessions...")
                );
            }

            return e('div', { className: "min-h-screen pb-12 font-sans bg-gray-50" },
                e('header', { className: "bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm" },
                    e('div', { className: "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 md:py-4" },
                        e('div', { className: "flex flex-col md:flex-row md:items-center justify-between gap-3 md:gap-6" },
                            e('div', { className: "flex items-center justify-center md:justify-start gap-3" },
                                e('img', { src: "header.png", alt: "WCG Logo", className: "h-10 md:h-16 w-auto object-contain" })
                            ),
                            e('div', { className: "flex items-center gap-2 md:gap-3" },
                                e('a', { href: "calendar.html", className: "flex items-center justify-center h-10 w-10 md:w-auto md:px-4 rounded-lg border-2 border-gray-300 hover:border-wcg-blue hover:bg-gray-50 transition-colors text-gray-700 flex-shrink-0 gap-2", title: "Calendar View" },
                                    e(Icons.Calendar), e('span', { className: "hidden md:inline font-bold text-xs uppercase tracking-wide" }, "Calendar")
                                ),
                                e('div', { className: "relative flex-1 md:w-80 lg:w-96 icon-hover" },
                                    e('div', { className: "absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400" }, e(Icons.Search)),
                                    e('input', {
                                        type: "text",
                                        placeholder: "Search by topic, description...",
                                        className: "block w-full pl-10 pr-4 py-2 md:py-2.5 border border-gray-200 rounded-full bg-gray-50 focus:outline-none focus:bg-white focus:border-wcg-blue focus:ring-1 focus:ring-wcg-blue sm:text-sm transition-all",
                                        value: searchTerm,
                                        onChange: (e) => setSearchTerm(e.target.value)
                                    })
                                ),
                                e('div', { className: "relative" },
                                    e('button', {
                                        onClick: () => setMenuOpen(!menuOpen),
                                        className: "flex items-center justify-center w-10 h-10 rounded-lg border-2 border-gray-300 hover:border-wcg-blue hover:bg-gray-50 transition-colors flex-shrink-0"
                                    }, menuOpen ? e('svg', { className: "w-5 h-5 text-gray-700", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M6 18L18 6M6 6l12 12" })) : e('svg', { className: "w-5 h-5 text-gray-700", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M4 6h16M4 12h16M4 18h16" }))),
                                    menuOpen && e('div', { className: "absolute right-0 top-12 bg-white rounded-xl shadow-lg border border-gray-200 py-2 w-52 z-50" },
                                        e('a', { href: "index.html", className: "block px-4 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-50 hover:text-wcg-blue transition-colors" }, "Home"),
                                        e('a', { href: "profile.html", className: "block px-4 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-50 hover:text-wcg-blue transition-colors" }, "My Attendance"),
                                        e('a', { href: "sessions.html", className: "block px-4 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-50 hover:text-wcg-blue transition-colors font-bold border-l-4 border-wcg-blue bg-blue-50" }, "Upcoming Sessions"),
                                        e('a', { href: "pathway.html", className: "block px-4 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-50 hover:text-wcg-blue transition-colors" }, "Pathway Overview"),
                                        e('a', { href: "https://wcedeportal.co.za/meet-the-team", className: "block px-4 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-50 hover:text-wcg-blue transition-colors" }, "Contact eLearning")     
                                    )
                                )
                            )
                        ),
                        e('div', { className: "mt-3 md:mt-6 flex flex-wrap gap-2 md:gap-3 items-center pt-3 md:pt-4 border-t border-gray-100" },
                            e('div', { className: "relative" },
                                e('select', {
                                    value: selectedDistrict,
                                    onChange: (e) => setSelectedDistrict(e.target.value),
                                    className: "appearance-none bg-white border border-gray-200 text-gray-700 py-1.5 md:py-2 pl-3 md:pl-4 pr-8 md:pr-10 rounded-lg focus:outline-none focus:ring-1 focus:ring-wcg-blue text-xs md:text-sm cursor-pointer shadow-sm"
                                }, districts.map(d => e('option', { key: d, value: d }, d === 'All' ? 'All Districts' : d))),
                                e('div', { className: "pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500" }, e(Icons.ChevronDown))
                            ),
                            e('div', { className: "relative" },
                                e('select', {
                                    value: selectedSessionName,
                                    onChange: (e) => setSelectedSessionName(e.target.value),
                                    className: "appearance-none bg-white border border-gray-200 text-gray-700 py-1.5 md:py-2 pl-3 md:pl-4 pr-8 md:pr-10 rounded-lg focus:outline-none focus:ring-1 focus:ring-wcg-blue text-xs md:text-sm cursor-pointer shadow-sm max-w-[160px] md:max-w-[200px] truncate"
                                }, sessionNames.map(name => e('option', { key: name, value: name }, name === 'All' ? 'All Sessions' : name))),
                                e('div', { className: "pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500" }, e(Icons.ChevronDown))
                            ),
                            (selectedDistrict !== 'All' || selectedSessionName !== 'All' || searchTerm !== '') && e('button', {
                                onClick: () => { setSelectedDistrict('All'); setSelectedSessionName('All'); setSearchTerm(''); },
                                className: "text-xs md:text-sm text-wcg-red hover:text-red-700 font-bold ml-auto px-2 md:px-3 py-1 rounded hover:bg-red-50 transition-colors uppercase tracking-wide"
                            }, "Clear")
                        )
                    ),
                  e('div', { className: "h-1.5 w-full bg-gradient-to-r from-wcg-blue to-wcg-green2" })
                ),
                e('main', { className: "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" },
                    error && e('div', { className: "mb-8 p-6 bg-red-50 border border-red-100 rounded-xl shadow-sm" },
                        e('div', { className: "flex items-start gap-4" },
                            e('span', { className: "text-wcg-red mt-1" }, e(Icons.AlertTriangle)),
                            e('div', null,
                                e('h3', { className: "font-bold text-wcg-red text-lg" }, error === 'empty' ? "No Virtual Sessions Found" : "Unable to Load Sessions"),
                                e('p', { className: "text-gray-700 mt-1 text-sm" },
                                    error === 'empty'
                                        ? "No sessions with a delivery mode of \"Virtual\" were found in Supabase."
                                        : "There was a problem fetching data from Supabase. Please check your connection and try again."
                                ),
                                e('div', { className: "mt-4 pt-4 border-t border-red-100" },
                                    e('button', {
                                        onClick: fetchData,
                                        className: "cursor-pointer bg-white border border-gray-300 hover:border-wcg-blue text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm flex items-center gap-2 w-fit"
                                    }, e(Icons.RefreshCw), e('span', null, "Retry"))
                                )
                            )
                        )
                    ),
                    Object.keys(groupedSessions).length === 0 && !loading && !error ? e('div', { className: "text-center py-24 bg-white rounded-2xl shadow-sm border border-dashed border-gray-300" },
                        e('h3', { className: "text-xl font-bold text-gray-900 font-accent" }, "No sessions found"),
                        e('button', { onClick: () => { setSelectedDistrict('All'); setSelectedSessionName('All'); setSearchTerm(''); }, className: "mt-6 text-wcg-blue hover:text-blue-800 font-bold uppercase text-sm tracking-wide" }, "Clear all filters")
                    ) : e('div', { className: "space-y-12" },
                        Object.keys(groupedSessions).map(month => e('section', { key: month, className: "relative" },
                            e('div', { className: "flex items-center gap-4 mb-6 sticky top-20 z-10 py-3 bg-gray-50/95 backdrop-blur-sm" },
                                e('div', { className: "w-1.5 h-8 bg-wcg-blue rounded-full" }),
                                e('h2', { className: "text-2xl font-bold text-wcg-blue tracking-tight font-accent" }, month),
                                e('div', { className: "h-px bg-gray-200 flex-grow" })
                            ),
                            e('div', { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" },
                                groupedSessions[month].map(session => e(SessionCard, { key: session.id, session: session, currentTime: currentTime }))
                            )
                        ))
                    )
                ),
                e('footer', { className: "bg-white border-t border-gray-200 mt-20 py-8" },
                    e('div', { className: "max-w-7xl mx-auto px-4 text-center" },
                        e('p', { className: "text-gray-400 text-xs font-accent font-bold tracking-widest uppercase" }, "© 2026 Western Cape Government")
                    )
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>

</html>
